    - ux
    origin: manual
    discovered: 2026-04-07
    achieved: 2026-04-08
  T6.1:
    name: bullseye_init tool creates starter targets.yaml
    status: achieved
    value: 5.0
    cost: 2.0
    actual_cost: 2.0
    acceptance:
    - bullseye_init creates docs/targets.yaml with a sensible skeleton
    - Includes a sample target demonstrating the schema
    - Works from any cwd (creates docs/ directory if needed)
    - Idempotent — refuses to overwrite an existing file
    context: |
      Eliminates the cold-start problem. A new user's first interaction with bullseye produces a working targets file they can immediately build on.
    tags:
    - adoption
    origin: manual
    discovered: 2026-04-07
    achieved: 2026-04-08
  T6.2:
    name: Auto-create targets.yaml on first bullseye_put
    status: achieved
    value: 3.0
    cost: 2.0
    actual_cost: 2.0
    acceptance:
    - bullseye_put creates docs/targets.yaml if it doesn't exist
    - The created file contains only the added target (no sample data)
    - Other mutation tools (retire) still error on missing file
    context: |
      Complementary to bullseye_init. If an agent calls bullseye_put before init, it should just work rather than erroring. This makes the tool more forgiving in agentic workflows where the agent may not know to call init first. (Originally filed against bullseye_add; renamed when the add/update pair was unified into bullseye_assert in v0.8.0, then again to bullseye_put in v0.12.0.)
    tags:
    - adoption
    origin: manual
    discovered: 2026-04-07
    achieved: 2026-04-07
  T6.3:
    name: Copy-pasteable CLAUDE.md snippet for target management
    status: achieved
    value: 3.0
    cost: 1.0
    actual_cost: 1.0
    acceptance:
    - README and agents-guide include a CLAUDE.md section users can paste into their project
    - The snippet tells agents to use bullseye tools for target management
    - Works standalone — doesn't require other skills or setup
    context: |
      The snippet bridges the gap between "bullseye is installed as an MCP server" and "agents actually use it." Without explicit CLAUDE.md instructions, agents won't know bullseye exists even if it's registered.
    tags:
