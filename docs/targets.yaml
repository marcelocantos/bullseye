    - Portfolio-level WSJF ranking orders repos by aggregate priority
    - /cv global presents top repos, per-repo frontier, cross-repo blockers
    context: |
      Design note: docs/mcp-triad.md section 6. Within a repo, agent capacity is unlimited and the state machine optimises for parallel throughput. Across repos, human attention is the scarce resource — WSJF returns as the scheduling primitive. The global view meshes per-repo target graphs into a cross-repo quasi-graph with explicit dependency edges, momentum signals from mnemo, and portfolio-level ranking.
