    - No stale references to the old markdown-based workflow remain
    context: |
      The global CLAUDE.md has extensive directives about targets.md format, /cv behaviour, and convergence workflow. These all need updating once bullseye is the primary system. This happens at cutover — when parallel running has built enough confidence to drop markdown.
    depends_on:
