    - mnemo_restore returns structured target context
    context: |
      Depends on mnemo T10 (live context compaction). The summarizer speaks the language of the target graph instead of free-text. See docs/mcp-triad.md section 3.
    tags:
    - mnemo
    origin: manual
    discovered: 2026-04-07
