targets:
  T1:
    name: MCP triad integration (targets + sawmill + mnemo)
    status: identified
    value: 13
    cost: 8
    acceptance:
      - targets_verify tool executes sawmill checks against acceptance criteria
      - /cv skill calls targets_rank + mnemo_recent_activity instead of parsing markdown
      - Rework diagnosis includes sawmill failure report and mnemo session history
    context: >
      Design note: docs/mcp-triad.md. The three MCP servers (targets, sawmill,
      mnemo) each own a distinct concern (plan, code, history). Integrating them
      replaces the monolithic /cv skill with composable typed tool calls — faster,
      deterministic, and testable. The highest-value integration point is the /cv
      skill rewrite (step 3 in the design note).
    tags:
      - integration
      - architecture
    discovered: 2026-04-07

  T1.1:
    name: Executable acceptance checks via sawmill
    parent: T1
    status: identified
    value: 8
    cost: 5
    acceptance:
      - Target schema has optional checks field (convention, query, invariant types)
      - targets_verify tool iterates checks and calls sawmill tools
      - Structured pass/fail report with file/line-level detail
    context: >
      Phase 1 uses sawmill's existing check_conventions and query tools.
      Phase 2 adds structural invariants when sawmill T19 lands.
      See docs/mcp-triad.md section 1.
    depends_on: []
    tags:
      - sawmill
    discovered: 2026-04-07

  T1.2:
    name: Momentum-aware ranking via mnemo
    parent: T1
    status: identified
    value: 5
    cost: 3
    acceptance:
      - targets_rank accepts optional momentum signal
      - Ranking integrates session recency and frequency from mnemo_recent_activity
      - Momentum factor is tunable, not hardcoded
    context: >
      Static WSJF ranking ignores whether a target is actively being worked on
      or has been stale for weeks. mnemo_recent_activity provides the signal;
      the /cv skill merges it with targets_rank output.
      See docs/mcp-triad.md section 2.
    depends_on: []
    tags:
      - mnemo
    discovered: 2026-04-07

  T1.3:
    name: /cv skill rewrite against MCP tools
    parent: T1
    status: identified
    value: 8
    cost: 3
    acceptance:
      - /cv calls targets_frontier + targets_rank (no markdown parsing)
      - /cv optionally calls mnemo_recent_activity for momentum
      - Total tool calls bounded (3-6), no unbounded agent exploration
      - Output quality matches or exceeds current /cv
    context: >
      Highest-value integration point — immediate daily workflow improvement.
      The skill shrinks from ~200 lines to ~20 lines of tool orchestration.
      See docs/mcp-triad.md section 5.
    depends_on:
      - T1.1
      - T1.2
    tags:
      - skill
    discovered: 2026-04-07

  T1.4:
    name: Target-aware context compaction
    parent: T1
    status: identified
    value: 5
    cost: 3
    acceptance:
      - mnemo summarizer calls targets_list to anchor compaction output
      - Compaction includes targets_active, targets_progressed, targets_next fields
      - mnemo_restore returns structured target context
    context: >
      Depends on mnemo T10 (live context compaction). The summarizer speaks
      the language of the target graph instead of free-text.
      See docs/mcp-triad.md section 3.
    depends_on: []
    tags:
      - mnemo
    discovered: 2026-04-07

  T2:
    name: Global portfolio view across all repos
    status: identified
    value: 13
    cost: 8
    acceptance:
      - targets_portfolio tool discovers and loads targets.yaml from all managed repos
      - Cross-repo dependency edges are explicit and surfaced in ranking
      - Portfolio-level WSJF ranking orders repos by aggregate priority
      - /cv global presents top repos, per-repo frontier, cross-repo blockers
    context: >
      Design note: docs/mcp-triad.md section 6. Within a repo, agent capacity
      is unlimited and the state machine optimises for parallel throughput.
      Across repos, human attention is the scarce resource — WSJF returns as
      the scheduling primitive. The global view meshes per-repo target graphs
      into a cross-repo quasi-graph with explicit dependency edges, momentum
      signals from mnemo, and portfolio-level ranking.
    tags:
      - portfolio
      - architecture
    discovered: 2026-04-07

  T2.1:
    name: Cross-repo target discovery
    parent: T2
    status: identified
    value: 5
    cost: 3
    acceptance:
      - Discovers targets.yaml from managed-repos.md and ~/work/ walk
      - Loads and validates each repo's target graph independently
      - Handles missing/invalid files gracefully (skip with warning)
    context: >
      Sources: ~/.claude/managed-repos.md (canonical), ~/work/ walk (fallback),
      mnemo_repos (enrichment for recently-active repos not in managed list).
    depends_on: []
    tags:
      - portfolio
    discovered: 2026-04-07

  T2.2:
    name: Cross-repo dependency edges
    parent: T2
    status: identified
    value: 8
    cost: 5
    acceptance:
      - Schema supports cross_depends and cross_enables fields with repo + capability/target refs
      - Cross-repo edges surfaced in targets_portfolio output
      - Targets enabling work in other repos get a priority boost
    context: >
      Manual cross_depends/cross_enables fields are accurate but high-friction.
      Future enrichment: mnemo could detect cross-repo references automatically
      from sessions that reference another repo's targets. Start manual.
    depends_on:
      - T2.1
    tags:
      - portfolio
    discovered: 2026-04-07

  T2.3:
    name: Portfolio-level WSJF ranking
    parent: T2
    status: identified
    value: 8
    cost: 5
    acceptance:
      - Repos ranked by aggregate frontier weight adjusted for momentum
      - Cross-repo enablers get value propagation boost
      - targets_portfolio returns ranked repos with per-repo frontier and reasoning
      - Momentum from mnemo_recent_activity integrated into ranking
    context: >
      Aggregate score: sum(frontier_weight * momentum) / frontier_size.
      Repos with more frontier targets are more parallelisable and need less
      per-unit human attention. Cross-repo enablers propagate value from
      downstream repos. See docs/mcp-triad.md section 6.
    depends_on:
      - T2.1
      - T2.2
    tags:
      - portfolio
      - mnemo
    discovered: 2026-04-07

  T2.4:
    name: /cv global mode
    parent: T2
    status: identified
    value: 5
    cost: 3
    acceptance:
      - "/cv global" runs portfolio-level evaluation
      - Presents top 1-3 repos with reasoning
      - Shows cross-repo blockers and enablers
      - Includes momentum report (active vs stale repos)
    context: >
      Heavier than single-repo /cv (discovers repos, loads multiple YAML,
      calls mnemo). Runs on explicit request or at session start when no
      specific repo context.
    depends_on:
      - T2.3
      - T1.3
    tags:
      - skill
      - portfolio
    discovered: 2026-04-07

  T3:
    name: Protocol app priority sync
    status: identified
    value: 8
    cost: 8
    acceptance:
      - targets_portfolio output written to a targets_priorities SQLite table
      - sqlpipe replicates priorities to Protocol's protocol.db via pigeon
      - Protocol Today page shows Focus section with top frontier targets
      - Sync runs periodically (cron or daemon hook)
    context: >
      Design note: docs/mcp-triad.md section 7. The portfolio ranking should
      surface on the phone so Marcelo sees top priorities when he picks up
      his phone. The sync chain is: targets_portfolio → SQLite table →
      sqlpipe over pigeon → Protocol Today page. Protocol already uses SQLite
      for all storage. jevon T10 tracks the same sqlpipe-over-pigeon pattern
      for jevon's mobile app — same infrastructure.
    cross_depends:
      - repo: marcelocantos/pigeon
        capability: "Encrypted WebSocket relay"
      - repo: marcelocantos/sqlpipe
        capability: "Bidirectional SQLite replication"
    tags:
      - protocol
      - mobile
    discovered: 2026-04-07

  T3.1:
    name: targets_priorities SQLite table and writer
    parent: T3
    status: identified
    value: 5
    cost: 3
    acceptance:
      - targets_portfolio output upserted into targets_priorities table
      - Table schema includes repo, name, weight, context, horizon, updated_at
      - Periodic refresh via cron or daemon hook
    context: >
      Laptop-owned table. Protocol is read-only. Horizon field (today/tomorrow/
      this_week) maps to Protocol's daily view paging.
    depends_on:
      - T2.3
    tags:
      - protocol
    discovered: 2026-04-07

  T3.2:
    name: Protocol Today page Focus section
    parent: T3
    status: identified
    value: 5
    cost: 3
    acceptance:
      - Focus section renders above daily checklist
      - Shows top frontier targets with repo, weight, and name
      - Updates on sync without manual refresh
    context: >
      Reads from targets_priorities table in protocol.db. Tapping a priority
      shows context in a detail sheet. Future: deep-link to repo.
    depends_on:
      - T3.1
    tags:
      - protocol
      - mobile
    discovered: 2026-04-07

  T4:
    name: Dynamic session startup context
    status: identified
    value: 8
    cost: 3
    acceptance:
      - mnemo_startup_context tool returns structured context for current project
      - Includes recently active repos with session counts and recency
      - Agent sees recent activity without running /waw or /cv
    context: >
      Design note: docs/mcp-triad.md section 8. High value, low cost — wraps
      existing mnemo_recent_activity with formatting. Answers "where was I?"
      at session start. Implementation: Option B (explicit tool call from
      CLAUDE.md instruction) for now, Option C (MCP resource) when protocol
      support matures.
    tags:
      - mnemo
      - startup
    discovered: 2026-04-07

  T4.1:
    name: mnemo_startup_context tool
    parent: T4
    status: identified
    value: 5
    cost: 2
    acceptance:
      - Returns per-repo summary with session counts, recency, and active targets
      - Formatted for easy agent consumption
      - Filterable by project (current working directory)
    context: >
      Wraps mnemo_recent_activity with target-aware enrichment. If the targets
      MCP server is available, includes frontier targets per repo. Otherwise
      falls back to session-only data.
    depends_on: []
    tags:
      - mnemo
    discovered: 2026-04-07

  T4.2:
    name: CLAUDE.md auto-call directive
    parent: T4
    status: identified
    value: 3
    cost: 1
    acceptance:
      - Global CLAUDE.md instructs agent to call mnemo_startup_context at session start
      - Context is presented to the agent without user intervention
    context: >
      A one-line addition to ~/.claude/CLAUDE.md. Depends on mnemo_startup_context
      existing. Low cost, immediate value.
    depends_on:
      - T4.1
    tags:
      - startup
    discovered: 2026-04-07

  T5:
    name: Migration from markdown targets to bullseye
    status: identified
    value: 8
    cost: 5
    acceptance:
      - All repos using docs/targets.md can be migrated to docs/targets.yaml
      - /cv and related skills work against both old (markdown) and new (bullseye) formats during transition
      - No loss of target history or structure during migration
      - Clear cutover point after which markdown targets are retired
    context: >
      Moving from the current markdown-based target system (docs/targets.md parsed
      by /cv) to the bullseye MCP server (docs/targets.yaml) is a cross-repo
      migration. Many repos have established targets in markdown. The transition
      needs to handle: (1) converting existing markdown targets to YAML schema,
      (2) a dual-read period where /cv works with both formats, (3) updating
      global CLAUDE.md directives that reference the old format, (4) migrating
      skills that parse targets.md directly. The migration touches every repo
      with a targets.md file.
    tags:
      - migration
      - architecture
    discovered: 2026-04-07

  T5.1:
    name: Markdown-to-YAML target converter
    parent: T5
    status: identified
    value: 5
    cost: 3
    acceptance:
      - bullseye_import tool or standalone script reads docs/targets.md and emits docs/targets.yaml
      - Preserves target IDs, status, value/cost, acceptance criteria, parent/child relationships
      - Handles the common markdown conventions (🎯T prefix, status/weight/acceptance fields)
      - Produces valid YAML that passes bullseye_validate
    context: >
      The markdown format has no formal schema — it's whatever /cv and render.rs
      produce. The converter needs to be tolerant of minor formatting variations
      across repos.
    depends_on: []
    tags:
      - migration
    discovered: 2026-04-07

  T5.2:
    name: Dual-format /cv support during transition
    parent: T5
    status: identified
    value: 5
    cost: 3
    acceptance:
      - /cv detects whether the repo has targets.yaml (use bullseye) or only targets.md (use legacy parser)
      - Behaviour is identical from the user's perspective regardless of format
      - Repos can be migrated independently — no big-bang cutover
    context: >
      During transition, some repos will have targets.yaml and some will still
      have targets.md. The /cv skill needs to work with both. Once all repos are
      migrated, the legacy parser can be removed.
    depends_on:
      - T1.3
      - T5.1
    tags:
      - migration
      - skill
    discovered: 2026-04-07

  T5.3:
    name: Global CLAUDE.md and skill directives updated for bullseye
    parent: T5
    status: identified
    value: 3
    cost: 2
    acceptance:
      - ~/.claude/CLAUDE.md convergence-targets section references bullseye tools
      - Skills that reference targets.md parsing are updated to use bullseye MCP calls
      - No stale references to the old markdown-based workflow remain
    context: >
      The global CLAUDE.md has extensive directives about targets.md format,
      /cv behaviour, and convergence workflow. These all need updating once
      bullseye is the primary system. This should happen at cutover, not during
      the dual-format period.
    depends_on:
      - T5.2
    tags:
      - migration
    discovered: 2026-04-07

  T1.5:
    name: Rework diagnosis integration
    parent: T1
    status: identified
    value: 5
    cost: 5
    acceptance:
      - Verify target failure includes sawmill structural failure report
      - Rework diagnosis includes mnemo prior-attempt history
      - Combined diagnosis is passed as targets_rework payload
    context: >
      The rework agent gets maximum context: what failed (sawmill), what was
      tried before (mnemo), and retry budget status (targets).
      See docs/mcp-triad.md section 4.
    depends_on:
      - T1.1
    tags:
      - sawmill
      - mnemo
    discovered: 2026-04-07
