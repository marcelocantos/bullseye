targets:
  T1:
    name: MCP triad integration (targets + sawmill + mnemo)
    status: identified
    value: 13
    cost: 8
    acceptance:
      - targets_verify tool executes sawmill checks against acceptance criteria
      - /cv skill calls targets_rank + mnemo_recent_activity instead of parsing markdown
      - Rework diagnosis includes sawmill failure report and mnemo session history
    context: >
      Design note: docs/mcp-triad.md. The three MCP servers (targets, sawmill,
      mnemo) each own a distinct concern (plan, code, history). Integrating them
      replaces the monolithic /cv skill with composable typed tool calls — faster,
      deterministic, and testable. The highest-value integration point is the /cv
      skill rewrite (step 3 in the design note).
    tags:
      - integration
      - architecture
    discovered: 2026-04-07

  T1.1:
    name: Executable acceptance checks via sawmill
    parent: T1
    status: identified
    value: 8
    cost: 5
    acceptance:
      - Target schema has optional checks field (convention, query, invariant types)
      - targets_verify tool iterates checks and calls sawmill tools
      - Structured pass/fail report with file/line-level detail
    context: >
      Phase 1 uses sawmill's existing check_conventions and query tools.
      Phase 2 adds structural invariants when sawmill T19 lands.
      See docs/mcp-triad.md section 1.
    depends_on: []
    tags:
      - sawmill
    discovered: 2026-04-07

  T1.2:
    name: Momentum-aware ranking via mnemo
    parent: T1
    status: identified
    value: 5
    cost: 3
    acceptance:
      - targets_rank accepts optional momentum signal
      - Ranking integrates session recency and frequency from mnemo_recent_activity
      - Momentum factor is tunable, not hardcoded
    context: >
      Static WSJF ranking ignores whether a target is actively being worked on
      or has been stale for weeks. mnemo_recent_activity provides the signal;
      the /cv skill merges it with targets_rank output.
      See docs/mcp-triad.md section 2.
    depends_on: []
    tags:
      - mnemo
    discovered: 2026-04-07

  T1.3:
    name: /cv skill rewrite against MCP tools
    parent: T1
    status: identified
    value: 8
    cost: 3
    acceptance:
      - /cv calls targets_frontier + targets_rank (no markdown parsing)
      - /cv optionally calls mnemo_recent_activity for momentum
      - Total tool calls bounded (3-6), no unbounded agent exploration
      - Output quality matches or exceeds current /cv
    context: >
      Highest-value integration point — immediate daily workflow improvement.
      The skill shrinks from ~200 lines to ~20 lines of tool orchestration.
      See docs/mcp-triad.md section 5.
    depends_on:
      - T1.1
      - T1.2
    tags:
      - skill
    discovered: 2026-04-07

  T1.4:
    name: Target-aware context compaction
    parent: T1
    status: identified
    value: 5
    cost: 3
    acceptance:
      - mnemo summarizer calls targets_list to anchor compaction output
      - Compaction includes targets_active, targets_progressed, targets_next fields
      - mnemo_restore returns structured target context
    context: >
      Depends on mnemo T10 (live context compaction). The summarizer speaks
      the language of the target graph instead of free-text.
      See docs/mcp-triad.md section 3.
    depends_on: []
    tags:
      - mnemo
    discovered: 2026-04-07

  T2:
    name: Global portfolio view across all repos
    status: identified
    value: 13
    cost: 8
    acceptance:
      - targets_portfolio tool discovers and loads targets.yaml from all managed repos
      - Cross-repo dependency edges are explicit and surfaced in ranking
      - Portfolio-level WSJF ranking orders repos by aggregate priority
      - /cv global presents top repos, per-repo frontier, cross-repo blockers
    context: >
      Design note: docs/mcp-triad.md section 6. Within a repo, agent capacity
      is unlimited and the state machine optimises for parallel throughput.
      Across repos, human attention is the scarce resource — WSJF returns as
      the scheduling primitive. The global view meshes per-repo target graphs
      into a cross-repo quasi-graph with explicit dependency edges, momentum
      signals from mnemo, and portfolio-level ranking.
    tags:
      - portfolio
      - architecture
    discovered: 2026-04-07

  T2.1:
    name: Cross-repo target discovery
    parent: T2
    status: identified
    value: 5
    cost: 3
    acceptance:
      - Discovers targets.yaml from managed-repos.md and ~/work/ walk
      - Loads and validates each repo's target graph independently
      - Handles missing/invalid files gracefully (skip with warning)
    context: >
      Sources: ~/.claude/managed-repos.md (canonical), ~/work/ walk (fallback),
      mnemo_repos (enrichment for recently-active repos not in managed list).
    depends_on: []
    tags:
      - portfolio
    discovered: 2026-04-07

  T2.2:
    name: Cross-repo dependency edges
    parent: T2
    status: identified
    value: 8
    cost: 5
    acceptance:
      - Schema supports cross_depends and cross_enables fields with repo + capability/target refs
      - Cross-repo edges surfaced in targets_portfolio output
      - Targets enabling work in other repos get a priority boost
    context: >
      Manual cross_depends/cross_enables fields are accurate but high-friction.
      Future enrichment: mnemo could detect cross-repo references automatically
      from sessions that reference another repo's targets. Start manual.
    depends_on:
      - T2.1
    tags:
      - portfolio
    discovered: 2026-04-07

  T2.3:
    name: Portfolio-level WSJF ranking
    parent: T2
    status: identified
    value: 8
    cost: 5
    acceptance:
      - Repos ranked by aggregate frontier weight adjusted for momentum
      - Cross-repo enablers get value propagation boost
      - targets_portfolio returns ranked repos with per-repo frontier and reasoning
      - Momentum from mnemo_recent_activity integrated into ranking
    context: >
      Aggregate score: sum(frontier_weight * momentum) / frontier_size.
      Repos with more frontier targets are more parallelisable and need less
      per-unit human attention. Cross-repo enablers propagate value from
      downstream repos. See docs/mcp-triad.md section 6.
    depends_on:
      - T2.1
      - T2.2
    tags:
      - portfolio
      - mnemo
    discovered: 2026-04-07

  T2.4:
    name: /cv global mode
    parent: T2
    status: identified
    value: 5
    cost: 3
    acceptance:
      - "/cv global" runs portfolio-level evaluation
      - Presents top 1-3 repos with reasoning
      - Shows cross-repo blockers and enablers
      - Includes momentum report (active vs stale repos)
    context: >
      Heavier than single-repo /cv (discovers repos, loads multiple YAML,
      calls mnemo). Runs on explicit request or at session start when no
      specific repo context.
    depends_on:
      - T2.3
      - T1.3
    tags:
      - skill
      - portfolio
    discovered: 2026-04-07

  T1.5:
    name: Rework diagnosis integration
    parent: T1
    status: identified
    value: 5
    cost: 5
    acceptance:
      - Verify target failure includes sawmill structural failure report
      - Rework diagnosis includes mnemo prior-attempt history
      - Combined diagnosis is passed as targets_rework payload
    context: >
      The rework agent gets maximum context: what failed (sawmill), what was
      tried before (mnemo), and retry budget status (targets).
      See docs/mcp-triad.md section 4.
    depends_on:
      - T1.1
    tags:
      - sawmill
      - mnemo
    discovered: 2026-04-07
