  T6:
    name: Seamless new-user adoption
    status: achieved
    value: 8.0
    cost: 3.0
    actual_cost: 3.0
    acceptance:
    - A new user can go from "found the repo" to "bullseye is running and useful" with minimal friction
    - No cold-start problem — first interaction produces something useful
    - CLAUDE.md integration is copy-pasteable
    context: |
      A new user arriving at the repo faces several friction points: (1) installation is two steps (binary + MCP config), (2) there's no targets.yaml to start with, so the first tool call fails, (3) the real value comes from skill integration but there's no guidance on how to wire that up. Each sub-target removes one of these barriers.
    depends_on:
