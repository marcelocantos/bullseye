[package]
name = "bullseye"
version = "0.51.0"
edition = "2024"
description = "MCP server for managing targets — desired states with dependency tracking and frontier computation"
license = "Apache-2.0"
repository = "https://github.com/marcelocantos/bullseye"
authors = ["Marcelo Cantos"]
keywords = ["mcp", "targets", "scheduling", "planning", "frontier"]
categories = ["development-tools"]

[features]
# Default keeps full product surface (including SQLite priorities sync).
# Slim local clean builds: `cargo build --no-default-features` skips
# compiling bundled libsqlite3-sys (~6s on cold debug). See 🎯T48 and
# docs/build-perf-2026-04-11.md.
default = ["sqlite"]
sqlite = ["dep:rusqlite"]
# Event-path consumer: poll issuepipe Master → targets (🎯T33/T35).
# Default build stays free of the HTTP client dep.
github-issues = ["dep:ureq"]

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
fs2 = "0.4.3"
regex = "1"
rusqlite = { version = "0.39.0", features = ["bundled"], optional = true }
ureq = { version = "2.12.1", optional = true, default-features = true }
rust-mcp-sdk = { version = "0.9.0", default-features = false, features = ["server", "macros", "hyper-server"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
tempfile = "3"
sha2 = "0.10"
# Minimal set for bullseye + stdio MCP. Vendored SDK/transport patches
# (vendor/) stop forcing tokio "full" — 🎯T47.
tokio = { version = "1.50.0", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "io-util",
    "io-std",
    "process",
    # 🎯T78: the SDK's hyper-server graceful-shutdown path uses
    # tokio::signal, and "net" backs the axum listener. Both were
    # outside 🎯T47's trimmed set while stdio was the only transport.
    "signal",
    "net",
] }

# 🎯T47: trim tokio features in rust-mcp-sdk / rust-mcp-transport.
# Drop when upstream no longer enables features=["full"].
[patch.crates-io]
rust-mcp-sdk = { path = "vendor/rust-mcp-sdk" }
rust-mcp-transport = { path = "vendor/rust-mcp-transport" }
