[package]
name = "bullseye"
version = "0.1.0"
edition = "2024"
description = "MCP server for managing targets — desired states ranked by WSJF"
license = "Apache-2.0"
repository = "https://github.com/marcelocantos/bullseye"
authors = ["Marcelo Cantos"]
keywords = ["mcp", "targets", "wsjf", "scheduling", "planning"]
categories = ["development-tools"]

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
rust-mcp-sdk = { version = "0.9.0", default-features = false, features = ["server", "macros", "stdio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.50.0", features = ["full"] }
