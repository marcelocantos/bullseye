[package]
name = "bullseye"
version = "0.38.0"
edition = "2024"
description = "MCP server for managing targets — desired states with dependency tracking and frontier computation"
license = "Apache-2.0"
repository = "https://github.com/marcelocantos/bullseye"
authors = ["Marcelo Cantos"]
keywords = ["mcp", "targets", "scheduling", "planning", "frontier"]
categories = ["development-tools"]

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
fs2 = "0.4.3"
regex = "1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
rust-mcp-sdk = { version = "0.9.0", default-features = false, features = ["server", "macros", "stdio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
tempfile = "3"
# Only what bullseye itself needs. Note: rust-mcp-sdk 0.9 still declares
# `tokio` with `features = ["full"]`, so cargo feature-unification keeps
# the full set enabled until the SDK trims its dep — see 🎯 build-perf
# target for that. Declaring a minimal set here documents intent and
# takes effect the moment the SDK stops forcing `full`.
tokio = { version = "1.50.0", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "io-util",
] }
