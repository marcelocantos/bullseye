\* MUTATION: subdivision is regression, not refinement -- children spawn at
\* the parent's own depth, so each child claims a full share of capacity the
\* parent never handed over and the remaining work grows.  Expected RED on
\* IdempotentReentry (an engine step widens the gap).
CONSTANTS
    MaxTargets = 4
    MaxRoots = 2
    MaxDepth = 1
    MaxChildren = 2
    Fault = {"InflatingSplit"}

SPECIFICATION Spec

INVARIANTS
    LocalTypeOK
    TypeOK
    Soundness
    NoOrphanWork

PROPERTIES
    SettledIsStable
    GoalpostsFixed
    IdempotentReentry
    SelfHealing
    Stabilizes
    Quiescence
