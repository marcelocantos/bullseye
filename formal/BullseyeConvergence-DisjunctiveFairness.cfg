\* FAIRNESS SCOPE: no mutation -- strong fairness stated over the whole
\* disjunction (some target is claimed / some target is achieved) rather
\* than per target.  Checks whether the obligation has to be per-instance.
CONSTANTS
    MaxTargets = 4
    MaxRoots = 2
    MaxDepth = 1
    MaxChildren = 2
    Fault = {}

SPECIFICATION SpecDisjunctiveFairness

PROPERTIES
    SelfHealing
    Stabilizes
    Quiescence
