\* MUTATION: rollup runs ahead of the work -- the agent achieves a parent
\* without requiring its children to be terminal.  Expected RED on
\* Soundness (an achieved target sits over open children).
CONSTANTS
    MaxTargets = 4
    MaxRoots = 2
    MaxDepth = 1
    MaxChildren = 2
    Fault = {"EagerRollup"}

SPECIFICATION Spec

INVARIANTS
    LocalTypeOK
    TypeOK
    Soundness
    NoOrphanWork

PROPERTIES
    SettledIsStable
    GoalpostsFixed
    IdempotentReentry
    SelfHealing
    Stabilizes
    Quiescence
