\* MUTATION: the engine closes the gap by editing its own inputs -- it
\* deletes the root target instead of achieving it.  Expected RED on
\* GoalpostsFixed.  (The local NoOrphanWork invariant catches it too, and
\* invariants are checked first, so it is left out of this config to let the
\* universal property be the one that names the failure.)
CONSTANTS
    MaxTargets = 4
    MaxRoots = 2
    MaxDepth = 1
    MaxChildren = 2
    Fault = {"DeleteTarget"}

SPECIFICATION Spec

INVARIANTS
    LocalTypeOK
    TypeOK
    Soundness

PROPERTIES
    SettledIsStable
    GoalpostsFixed
    IdempotentReentry
    SelfHealing
    Stabilizes
    Quiescence
