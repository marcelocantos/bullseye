\* FAIRNESS DEMONSTRATION: no mutation -- the same protocol, checked under
\* weak fairness on the engine's work actions instead of strong fairness.
\* Claim(t) needs the single claim slot free and Achieve(t) needs the claim
\* still held, and LoseClaim can revoke it at any moment, so neither action
\* is ever continuously enabled.  Weak fairness is then satisfied by a
\* behaviour that never achieves anything.  Expected RED on SelfHealing.
CONSTANTS
    MaxTargets = 4
    MaxRoots = 2
    MaxDepth = 1
    MaxChildren = 2
    Fault = {}

SPECIFICATION SpecWeakFairness

PROPERTIES
    SelfHealing
