    - Tests dropping showcase-specific behaviour (legacy_observable_field_still_deserialises, retire_showcase_target_requires_demonstration, retire_non_showcase_target_does_not_require_demonstration, showcase_field_yaml_roundtrip, showcase_flag_changes_frontier_order, tunnels_treats_showcase_work_as_checkpoint) are removed; remaining `Target` literals build cleanly without `showcase` / `demonstration`
