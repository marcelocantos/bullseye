  T78.1:
    name: Caches that assumed a short-lived process stay correct in a long-lived daemon
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: '367 tests pass (make bullseye: fmt, clippy -D warnings, suite). Commits 3522d53 and 1217df8. Each criterion probed, and each new oracle verified to bite by mutation rather than assumed: (1) id_alloc keys validity on a SHA-256 of `git rev-parse --all`, so a moved ref invalidates — removing the check fails daemon_cache_test with got:{"T1"}; (2) that test does the A/B in one process and lives in its own binary so no other test can clear the cache and mask it; (3) resolve gains a TTL as its correctness mechanism, proved wired end to end by cache_ttl_test, which first asserts memoisation IS happening so the reload assertion cannot pass vacuously — removing the expiry check fails it with NotFound; (4) all three path-keyed caches sweep expired entries on insert, so they are bounded by what was touched within the TTL rather than by everything ever touched; (5) --default-location being machine-wide under the daemon is documented in AGENTS.md. Residue, declared: the in-process serialization idea was measured and NOT implemented, because flock(2) is per open file description and already excludes threads — 8 concurrent same-process mutations, 8 committed, 8 landed, no lost update (concurrent_mutation_test). An in-process lock remains available as a fairness/latency optimisation only.'
    acceptance:
    - '`id_alloc::CACHE` no longer serves a git-history set captured before the repo''s HEAD moved. Either invalidate on the repo''s git tip (cheap: `git rev-parse --all` or the ref mtime), or drop the cache on the mutation path where correctness depends on it. Demonstrated by the repro below going from ok to code=id_reserved.'
    - 'A regression test performs that A/B against one long-lived process: prime the history cache, move an ID into history-only, then attempt an explicit create of it. The long-lived path must refuse with id_reserved exactly as a fresh process does.'
    - '`resolve::CACHE` (workspace root to repo list) either invalidates or is documented as accepting staleness; today a repo cloned after the daemon started stays invisible until restart.'
    - The three path-keyed caches (id_alloc, resolve, store::PARSE_CACHE) are bounded, or their unbounded growth is measured and accepted in writing. They currently grow one entry per repo touched, forever.
    - '`PROCESS_DEFAULT_LOCATION` being machine-wide rather than per-session under the daemon is documented, since `--default-location` was previously a per-invocation choice.'
    context: |
      Raised by the owner 2026-08-31: "As a stdio server Bullseye naturally isolates its memory between repos. What happens in the new server?"

      Answer, verified: memory is not shared BETWEEN repos — all three caches are keyed by absolute path, so there is no cross-repo mixing. What is lost is isolation by process death. `id_alloc::CACHE` documents itself as "the production cache lives for the process lifetime; production code does not call [clear]". Under stdio that lifetime was one agent session; under a supervised daemon it is until the unit restarts.

      DEMONSTRATED, not theorised. Same repo, same on-disk state (T2 present in git history, absent from the live file, therefore reserved by 🎯T28):
        - fresh process:  code=id_reserved — "collides with a target recorded in git history"
        - long-lived daemon: ok: true — created 🎯T2, silently reusing the reserved ID
      The daemon had cached that repo's history set before the T2 commits existed, and never re-read it. This is precisely the collision T28 exists to prevent, and it fails silently: the caller gets a success envelope.

      Blast radius: two branches, or two clones, independently assigned the same target ID — the ledger's identity invariant. Worse in a daemon than the old bug class because the stale window is now unbounded rather than one session.

      Note the flock/CAS/content_hash machinery is unaffected: it re-reads under lock every time. The defect is specific to caches that were correct only because the process was short-lived.
    tags:
    - transport
    - correctness
    - cache
    origin: manual
    discovered: 2026-09-01
    achieved: 2026-09-01
  T8:
    name: bullseye_put refuses silent mutation of achieved targets
    status: achieved
    value: 5.0
    cost: 2.0
    actual_cost: 2.0
    acceptance:
    - bullseye_put rejects name/acceptance/context/value/cost/tags/kind/depends_on/verifies edits on a target with status `achieved`, returning an explanatory error
    - 'Error message indicates the remedy: re-open the target first by patching `status: identified`, then apply content changes'
    - Status-only transitions on achieved targets remain allowed (so un-retirement via explicit status change still works)
    - bullseye_retire and the existing retirement path continue to function unchanged
    - 'Test covers: content patch on achieved rejected with expected error; content patch on identified succeeds; status-only transition on achieved allowed; retirement path unaffected'
    context: 'On 2026-04-11 the agent ran bullseye_put(id=T4) intending to create a new top-level target, but T4 already existed as an achieved historical target ("Dynamic session startup context"). bullseye_put silently patched name/acceptance/context/value/cost/tags while leaving status: achieved intact, producing a Frankenstein target that required manual git reset + re-creation under a fresh ID (T7) to recover. Root cause: patch semantics on bullseye_put treat achieved targets the same as identified ones. Achieved targets are historical artifacts and their content should be immutable unless the human explicitly re-opens them. This target closes the footgun without changing the happy-path ergonomics.'
    tags:
    - safety
    - ergonomics
    origin: manual
    discovered: 2026-04-12
    achieved: 2026-04-12
  T9:
    name: agents-guide documents parallelised bullseye Makefile convention
    status: achieved
    value: 3.0
    cost: 1.0
    acceptance:
    - '`docs/agents-guide.md` §`bullseye_convergence` hook documents the decomposed Makefile form — `bullseye:` as an aggregator phony target depending on independent `check-fmt`, `check-clippy`, `check-tests`, `check-clean` sub-rules (or equivalent per-tool split)'
    - Preamble shows `NPROC := $(shell getconf _NPROCESSORS_ONLN 2>/dev/null || nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)` followed by `MAKEFLAGS += -j$(NPROC)` with portable fallback chain
    - 'Documents the caveat: parallelism only meaningfully helps projects with *mixed toolchains* (e.g. Go + Python + shellcheck + docs) because single-ecosystem builds (cargo, go test) already parallelise internally and contend on the workspace lock when run concurrently'
    - Existing bullseye repo Makefile example retained for simplicity — decomposed form is offered as the alternative for projects that benefit
    context: 'Discovered during the v0.13.0 release session when the user asked whether bullseye_convergence itself could be parallelised. Convergence-layer parallelism saves ~150ms at most (three branches — load+compute, make bullseye, git fix scan — can overlap but invariants dominates). Parallelising `make bullseye` via `-jN` is a separate lever: useful for projects with heterogeneous toolchains, near-useless for single-ecosystem cargo/go projects where internal build parallelism already saturates cores and clippy+test contend on target/. The convention should be documented in the agents-guide so new projects adopting bullseye know the option exists, along with when it''s worth the restructure. Also flags `~/.claude/CLAUDE.md` global directive "Never pass -j to make; projects that need parallel builds set MAKEFLAGS in their Makefiles" as the precedent being followed.'
    tags:
    - docs
    - conventions
    origin: Discovered during v0.13.0 release session
