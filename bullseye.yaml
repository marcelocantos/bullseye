  T28:
    name: Auto-assigned target IDs scan git history so parallel branches and sessions don't collide
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - bullseye_put (top-level ID auto-assignment) and bullseye_subdivide (sub-target ID auto-assignment) consult git history of bullseye.yaml across all local branches and remotes when picking the next free ID, in addition to the in-memory TargetsFile
    - The git scan uses a single invocation (git log -p --all --remotes -- bullseye.yaml) and greps additions for T<N> / T<N>.<M> keys; no per-commit subprocesses
    - Result is memoised per-process keyed by repo root to amortise the scan across multiple put/subdivide calls in the same session
    - External-mode repos (shadow tree, no git history) fall back to in-memory-only allocation with a non-blocking note that cross-branch collision avoidance is unavailable in that mode
    - When the local clone is missing remote branches (not fetched, or other-machine sessions never pushed), allocation can still collide — this is acknowledged in the implementation comment as an accepted edge case, not a bug
    - Tests cover historical IDs from past commits, IDs from a non-checked-out branch, external-mode fallback when no git repo is present, memoisation cache returns identical answers within a session, and IDs deleted from the current tree but still in history are still skipped
    - No public Rust API change beyond the new helper module; tool surface unchanged
    context: 'Observed in practice: two parallel sessions on different branches both auto-assigned the same next ID to different targets, producing collisions on merge. Root cause: next_top_level_id in handler.rs and next_subtarget_id in ops.rs (added in v0.29.0) scan only the in-memory TargetsFile, which reflects whatever is committed/checked out on the current branch. The git repo holds the global view — every branch and remote that has ever filed a target — and the auto-assignment path should consult it. UUIDs would be the maximally durable answer but unergonomic; a single git-log -p scan is cheap, covers every branch the local clone knows about, and tolerates the narrow remaining edge cases (un-fetched remote branches, cross-machine simultaneous sessions, external-mode shadow trees).'
    tags:
    - correctness
    - concurrency
    - schema
    origin: manual
    discovered: 2026-06-08
    achieved: 2026-06-08
  T29:
    name: Bullseye resolves repo references from leaf names or partial paths, identifying ambiguities
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - An MCP affordance accepts non-absolute repo references — leaf name (e.g. `spyder`), partial path (e.g. `marcelocantos/spyder`), or full host+org+repo path — and resolves them to the absolute repo root before discovery runs. Whether this is a standalone `bullseye_resolve(ref) -> path` tool or an extension of every tool's `cwd` parameter is an implementation choice; both surfaces are acceptable as long as the agent never has to scan portfolio output to find a repo by name.
    - Resolution scans the same workspace root used by `bullseye_portfolio` (default `~/work/`, configurable). Matches are decided by suffix of the absolute path's components, so `spyder` matches `~/work/github.com/marcelocantos/spyder` and `marcelocantos/spyder` matches the same path more specifically.
    - Ambiguous references — a leaf name matching two or more repos — return a structured error listing every candidate absolute path with a hint that the caller should re-issue with more path qualifiers (`org/repo` or full path). Bullseye never silently picks one.
    - Zero-match references return a structured not-found error suggesting `bullseye_portfolio` for the directory of available repos. The error names the workspace root that was scanned.
    - Absolute paths are passed through unchanged. The resolver is purely an enrichment over what already works.
    - Resolution scan is memoised per-process (same shape as the 🎯T28 git-history cache) so repeated calls in a session don't re-walk `~/work/`.
    - '`docs/agents-guide.md` documents the partial-reference forms accepted, the ambiguity-error contract, and the workspace-root scan. The current path-only contract in the guide is updated, not appended to.'
    context: |-
      Discovered 2026-06-20 during a /release session debrief. The current `cwd` contract is absolute-path-or-bust: every tool requires a path the caller has already resolved. The portfolio tool returns enough information to do leaf-name lookup, but the matching happens in the agent's head — read 30+ repos, eyeball the one that matches, copy its path back into the next tool call. That's the manual step we want to eliminate.

      The portfolio-scan-and-filter dance is the workaround, not the contract. The contract should be: pass a reference in whatever specificity you have, and bullseye either resolves it to a single path, surfaces an ambiguity for you to disambiguate, or tells you nothing matched. That's the affordance agents (and humans) already expect from tools like `gh repo view NAME` and `kubectl --context=NAME`.

      Suffix-match-on-path-components keeps the implementation simple and avoids inventing a registry: the workspace is already the source of truth. Ambiguity surfacing matters more than smart ranking — silently picking a winner is exactly the failure mode that makes name resolution feel magical-but-wrong in other tools.

      The acceptance leaves the surface (standalone `bullseye_resolve` vs. extending every `cwd`) open because both are coherent. Standalone is smaller and additive; integrating into `cwd` removes the affordance gap entirely but touches every tool. Decide during implementation.
    tags:
    - ergonomics
    - api
    - discovery
    origin: discovered during /release v0.31.0 debrief 2026-06-20 — agent had to scan portfolio output by hand to locate `spyder` repo by leaf name
    discovered: 2026-06-20
    achieved: 2026-06-20
