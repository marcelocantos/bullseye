schema_version: 1
targets:
  T1:
    name: MCP triad integration (targets + sawmill + mnemo)
    status: identified
    value: 13.0
    cost: 8.0
    acceptance:
    - targets_verify tool executes sawmill checks against acceptance criteria
    - /cv skill calls targets_rank + mnemo_recent_activity instead of parsing markdown
    - Rework diagnosis includes sawmill failure report and mnemo session history
    context: |
      Design note: docs/mcp-triad.md. The three MCP servers (targets, sawmill, mnemo) each own a distinct concern (plan, code, history). Integrating them replaces the monolithic /cv skill with composable typed tool calls — faster, deterministic, and testable. The highest-value integration point is the /cv skill rewrite (step 3 in the design note).
    depends_on:
    - T1.1
    - T1.2
    - T1.3
    - T1.4
    - T1.5
    tags:
    - integration
    - architecture
    origin: manual
    discovered: 2026-04-07
  T1.1:
    name: Executable acceptance checks via sawmill
    status: achieved
    value: 8.0
    cost: 5.0
    actual_cost: 5.0
    acceptance:
    - Target schema has optional checks field (convention, query, invariant types)
    - targets_verify tool iterates checks and calls sawmill tools
    - Structured pass/fail report with file/line-level detail
    context: |
      Phase 1 uses sawmill's existing check_conventions and query tools. Phase 2 adds structural invariants when sawmill T19 lands. See docs/mcp-triad.md section 1.
    tags:
    - sawmill
    origin: manual
    discovered: 2026-04-07
    achieved: 2026-04-11
  T1.2:
    name: Momentum-aware ranking via mnemo
    status: achieved
    value: 5.0
    cost: 3.0
    observable: true
    acceptance:
    - bullseye_summary accepts an optional momentum parameter (map of target ID to multiplier)
    - When momentum is present, each target's WSJF score is multiplied by its value before ranking; targets missing from the map default to 1.0 (no-op)
    - The section heading distinguishes momentum-adjusted from baseline rankings
    - Momentum values and the formula that produces them are the caller's responsibility — the factor is tunable without touching bullseye
    - /cv skill composes bullseye_summary and mnemo_recent_activity to produce the momentum-adjusted ordering
    context: Static WSJF ranking ignores whether a target is actively being worked on or has been stale for weeks. mnemo_recent_activity provides the signal; the /cv skill composes the two tools. Original acceptance referenced a `targets_rank` tool that was removed in v0.4.0 — updated when momentum landed on bullseye_summary (the current ranking entry point). See docs/mcp-triad.md section 2.
    tags:
    - mnemo
    origin: manual
    discovered: 2026-04-07
    achieved: 2026-04-13
  T1.3:
    name: /cv skill rewrite against MCP tools
    status: achieved
    value: 8.0
    cost: 3.0
    observable: true
    acceptance:
    - /cv calls targets_frontier + targets_rank (no markdown parsing)
    - /cv optionally calls mnemo_recent_activity for momentum
    - Total tool calls bounded (3-6), no unbounded agent exploration
    - Output quality matches or exceeds current /cv
    context: |
      Highest-value integration point — immediate daily workflow improvement. The skill shrinks from ~200 lines to ~20 lines of tool orchestration. See docs/mcp-triad.md section 5.
    depends_on:
    - T1.1
    - T1.2
    tags:
    - skill
    origin: manual
    discovered: 2026-04-07
    achieved: 2026-04-13
  T1.4:
    name: Target-aware context compaction
    status: identified
    value: 5.0
    cost: 3.0
    observable: true
    acceptance:
    - mnemo summarizer calls targets_list to anchor compaction output
    - Compaction includes targets_active, targets_progressed, targets_next fields
    - mnemo_restore returns structured target context
    context: |
      Depends on mnemo T10 (live context compaction), which is still identified — mnemo is currently an indexer with no summarizer or mnemo_restore tool. This bullseye-side target can't progress until mnemo ships the primitives. The summarizer speaks the language of the target graph instead of free-text. See docs/mcp-triad.md section 3.
    cross_depends:
    - repo: marcelocantos/mnemo
      target: T10
      capability: live context compaction (summarizer + mnemo_restore)
      note: T1.4 is blocked on mnemo shipping the summarizer and restore primitives
    tags:
    - mnemo
    origin: manual
    discovered: 2026-04-07
  T1.5:
    name: Rework diagnosis integration
    status: identified
    value: 5.0
    cost: 5.0
    observable: true
    acceptance:
    - Verify target failure includes sawmill structural failure report
    - Rework diagnosis includes mnemo prior-attempt history
    - Combined diagnosis is passed as targets_rework payload
    context: |
      The rework agent gets maximum context: what failed (sawmill), what was tried before (mnemo), and retry budget status (targets). Externally blocked: sawmill returns violations as plain strings (no structured file/line failure reports); mnemo has no rework-aware prior-attempt retrieval. Both upstream capabilities must land before this target can progress. See docs/mcp-triad.md section 4.
    depends_on:
    - T1.1
    cross_depends:
    - repo: marcelocantos/sawmill
      target: T24
      note: sawmill T24 (filed 2026-04-18) — structured failure payloads from check_conventions/check_invariants/query, consumed here as the "what failed" half of the rework diagnosis payload
    - repo: marcelocantos/mnemo
      capability: prior-attempt history retrieval per target
      note: mnemo currently indexes sessions but has no rework-aware query that returns prior attempts for a given target ID; target not yet filed upstream
    tags:
    - sawmill
    - mnemo
    origin: manual
    discovered: 2026-04-07
  T10:
    name: Target file is bullseye.yaml at repo root
    status: achieved
    value: 5.0
    cost: 3.0
    actual_cost: 3.0
    acceptance:
    - store::discover looks only at root-level bullseye.yaml
    - store::create_* creates bullseye.yaml at repo root
    - repo_root_from_targets_path reduces to path.parent()
    - render module deleted — no markdown output, no bullseye.md
    - bullseye_render tool removed from tool list
    - discover_markdown deleted
    - handle_render deleted
    - All tests use root-level bullseye.yaml
    - This repo's own file is bullseye.yaml at root
    - Docs (CLAUDE.md, agents-guide) reference bullseye.yaml, no mention of markdown rendering
    - Old paths (docs/targets.yaml, targets.yaml) are ignored — migrated in a separate pass
    context: Dual-layout support (docs/ vs root) added complexity for no benefit. Renaming from targets.yaml to bullseye.yaml makes the file self-identifying. The auto-rendered markdown view (targets.md / bullseye.md) is unwanted — gut the render module, the render tool, and all markdown output infrastructure entirely. Existing repos will be migrated in a bulk pass after this lands.
    tags:
    - refactor
    - simplification
    origin: user direction during Gap 3 discussion (2026-04-12)
    discovered: 2026-04-12
    achieved: 2026-04-12
  T11:
    name: bullseye_put no longer requires value/cost at repo scope and its documentation reflects the phase-boundary model
    status: achieved
    value: 13.0
    cost: 5.0
    acceptance:
    - '`bullseye_put` can create a repo-scope target without supplying `value` or `cost` (schema marks them optional; tool accepts creation without them)'
    - Tool description for `bullseye_put` explicitly states that value/cost are portfolio-scope metadata and `observable` is the relevant field at repo scope
    - 'A test exercises: repo-scope target creation without value/cost succeeds; repo-scope frontier ordering is invariant under value/cost mutation; observable-flag flips change repo-scope ordering as designed'
    - README, docs/mcp-triad.md §9, and the tool description all describe the phase boundary in consistent language
    - Follow-up PRs to `~/.claude/convergence.md` and `~/.claude/CLAUDE.md` clarify repo vs portfolio scoring (may be tracked as a separate target in those surfaces, but this target is not retired until the clarification is in flight)
    context: |-
      The README (§ "Phase boundary") and docs/mcp-triad.md §9 describe bullseye as using two different prioritisation engines: at repo scope (sub-week horizon, human as decision-maker), ordering is driven by distance-to-observable-checkpoint and `value`/`cost` are explicitly not consumed; at portfolio scope (weekly-plus horizon, human as allocator), WSJF with momentum and cross-repo enabler propagation is in force.

      The `bullseye_put` MCP tool schema, however, currently declares both `value` and `cost` as "Required on create". This forces every agent creating a repo-scope target to invent Fibonacci numbers that are ignored at repo scope — a consistent source of miscalibration. In the 2026-04-14 pageflip session this caused the agent to lean on WSJF/value-cost framing throughout, and to propose target sets scored as if ranking were value/cost-driven.

      Audit scope:
      1. Verify that the repo-scope frontier/ranking actually ignores value/cost (inspect the ranking module; run a test that mutates value/cost on a repo-scope fixture and asserts ordering is unchanged).
      2. Verify that `observable: true/false` on work targets is actually consumed by repo-scope ordering (distance-to-nearest-observable shortest path).
      3. If the design is implemented correctly: relax the tool schema so value/cost are optional; update the tool description to say "at repo scope, use `observable` on work targets that produce a human-reviewable checkpoint; value/cost are portfolio-scope metadata."
      4. If the design is NOT implemented correctly: decide whether to implement it or revise the design; either way, update README/docs so all three surfaces (tool, README, mcp-triad §9) agree.
      5. Propagate clarifications to downstream docs:
         - `~/.claude/convergence.md` § "Value and cost" (lines 110-191) currently reads as if WSJF is the universal scoring model; needs a top-level section on scope phases with WSJF relegated to portfolio scope.
         - `~/.claude/CLAUDE.md` § "Convergence targets" needs a paragraph stating "at repo scope, set `observable` on checkpoint targets; omit value/cost."
         - Agent auto-memory entries pointing at bullseye need updating in step.

      Doing this well upgrades every agent's target-creation behaviour without any per-agent prompt changes.
    origin: pageflip target-creation session 2026-04-14 — agent consistently populated value/cost at repo scope because the tool schema requires them, contradicting the design
    discovered: 2026-04-14
    achieved: 2026-04-15
  T12:
    name: Bullseye supports external targets storage with a configured mode and a guided first-run flow
    status: achieved
    value: 8.0
    cost: 8.0
    observable: true
    actual_cost: 8.0
    acceptance:
    - ~/.config/bullseye/config.yaml declares storage.mode as in_repo or external, with storage.root configurable (default ~/.local/share/bullseye)
    - 'mode: in_repo preserves current walk-up discovery behaviour'
    - 'mode: external resolves cwd by mirroring the absolute cwd path under storage.root as a shadow tree; external discover() walks up the shadow tree the same way in-repo discover() walks up the real tree'
    - No git-remote parsing or host/org/repo assumptions — resolution is purely path-driven and works for monorepos, non-git directories, and unconventional layouts
    - bullseye_portfolio in external mode roots scanning at storage.root
    - Missing config causes every tool to return a structured, imperative error instructing the agent to ask the user and then call bullseye_configure
    - A new bullseye_configure tool writes ~/.config/bullseye/config.yaml from validated mode and optional root parameters; rejects unknown modes; surfaces filesystem write errors
    - When the client advertises elicitation capability, the server offers the prompt via elicitation with a bounded timeout; on timeout, decline, or empty response it falls back to the error-message path
    - 'The elicitation prompt reads: ''Store targets where? in_repo — commit bullseye.yaml into the repo (you own it, team uses bullseye). external — shadow tree under ~/.local/share/bullseye/ (read-only repo, or personal use of bullseye). Answer: in_repo or external. Machine-wide; edit ~/.config/bullseye/config.yaml to change.'''
    - Malformed config file is reported with a parse error naming the file and field, never silently treated as default
    - No tool entry point returns empty/ambiguous success when configuration or resolution fails
    - README and docs/agents-guide.md describe both modes, the first-run flow, and the bullseye_configure tool
    context: 'Corporate adoption is blocked when the user can''t commit bullseye.yaml into managed repos. We need a supported external-storage mode, not a convention. Design points agreed in conversation 2026-04-15: (1) storage mode is an explicit setting, not auto-inferred; (2) external mode mirrors the cwd''s absolute path as a shadow tree under storage.root (default ~/.local/share/bullseye/) — purely path-driven, no git-remote or host/org/repo assumptions, so it works for monorepos, non-git dirs, and unconventional layouts; (3) external-mode discover() walks up the shadow tree identically to in-repo walk-up, keeping the algorithm symmetric; (4) MCP elicitation is unreliable across the client mix in use (Claude Code, opencode, Roo Code, Cline, VS Code extension) — detection via initialize capabilities is deterministic but ''advertised ≠ working'', so elicitation is a fast path with timeout + fallback, never the contract; (5) the fallback path must be easy for the agent to follow — a dedicated bullseye_configure tool is the single action it''s instructed to call, avoiding ad-hoc file writes; (6) invariant: every tool entry point terminates in either success-with-config or an explicit actionable error — no silent degradation, no infinite hangs. Personal-overlay mode (per-repo personal targets alongside in-repo team targets) was discussed and deferred — would bloat every tool''s surface area; revisit as a separate target if the need persists after real use.'
    tags:
    - storage
    - mcp
    - adoption
    origin: conversation 2026-04-15 — corporate adoption where repos can't host bullseye.yaml
    discovered: 2026-04-15
    achieved: 2026-04-15
  T12.1:
    name: Bullseye offers first-run storage-mode prompt via MCP elicitation when clients support it, with timeout fallback to error-message path
    status: achieved
    value: 3.0
    cost: 5.0
    acceptance:
    - When the client advertises elicitation capability at initialize, the server offers the locked first-run prompt via rust_mcp_sdk::McpServer::request_elicitation on the first tool call that needs config
    - Elicitation is wrapped in a bounded timeout (≤30s); on timeout, user decline, or empty response the server falls back to the error-message path, never hanging or silently succeeding
    - On successful elicitation response, the server writes ~/.config/bullseye/config.yaml and continues with the originally-requested tool call
    - Plumbing the Arc<dyn McpServer> runtime to individual tool handlers is done cleanly (e.g., stored on TargetHandler at initialize time) rather than by threading it through every function signature
    - The existing error-message path remains the contract for clients that don't advertise elicitation; no regression in cross-client compatibility (opencode, Roo Code, VS Code Claude Code extension, Cline, Claude Code)
    - 'Tests cover: elicitation-capable client successful prompt, timeout fallback, decline fallback, capability-absent client (uses error message only)'
    context: 'Deferred from 🎯T12 in favour of shipping the error-message-only path first. rust-mcp-sdk 0.9.0 exposes `McpServer::request_elicitation` on the runtime; threading it to handlers is a moderate refactor (handlers are currently sync and take no runtime). Elicitation is a UX fast-path, not a correctness contract — the error-message path must remain fully functional regardless. Invariant from 🎯T12 still holds: every tool entry point terminates in either success-with-config or explicit actionable error. Client mix in use at the target corporate team: Claude Code, opencode, Roo Code, Cline, VS Code Claude Code extension — support varies, and ''advertised ≠ working'', so detection-plus-timeout is mandatory.'
    depends_on:
    - T12
    tags:
    - storage
    - mcp
    - elicitation
    - ux
    origin: forked from 🎯T12 during implementation on 2026-04-15
    discovered: 2026-04-15
    achieved: 2026-04-15
  T13:
    name: File-watch handlers are cheap — heavy work deferred and debounced
    status: achieved
    value: 3.0
    cost: 2.0
    acceptance:
    - store::load() caches parsed TargetsFile keyed by absolute path, invalidated on mtime change
    - Repeated tool calls against an unchanged bullseye.yaml do not re-parse YAML
    - When the file is modified (mtime changes), the next call re-parses and serves fresh state
    - If a re-parse fails (malformed YAML mid-edit), the previous valid cached state is preserved and served
    - 'Thread safety: concurrent tool calls cannot race on the cache (std::sync::Mutex around HashMap<PathBuf, CacheEntry>)'
    - 'Tests: cache hit on unchanged mtime, cache miss + refresh on changed mtime, cache eviction after save, fallback to cached state when reparse fails'
    - No fsnotify/watcher dependency — lazy mtime-check approach satisfies the target without a file-watch event path
    context: 'Bullseye has no file watcher (no notify/fsnotify crate). The event-handler premise in the original description was moot. The lazy alternative is the right approach: an mtime-keyed parse cache in store::load() eliminates repeated YAML parses for unchanged files without any watcher infrastructure. The debounce window in the original description applied to a watcher architecture that doesn''t exist; this implementation sidesteps it entirely.'
    tags:
    - performance
    - watching
    origin: manual
    discovered: 2026-04-15
    achieved: 2026-04-15
  T14:
    name: '"observable" is renamed to "showcase" and forces visible demonstration before retirement'
    status: identified
    value: 5.0
    cost: 3.0
    acceptance:
    - The `observable` field is renamed to `showcase` (or equivalent) throughout schema, docs, and tooling
    - Target retirement requires a showcase step when the flag is set — documented in the convention and enforced in the bullseye_retire flow
    - 'Existing targets with `observable: true` are migrated to the new name'
    - Documentation explains the difference between a showcase target (must be demonstrated) and a regular work target (technical verification suffices)
    context: |-
      The current `observable` flag on work-kind targets signals that completion should produce something a human can look at. In practice, agents often stop at technical verification (server connected, tests pass, binary built) and never actually show the user-visible result. The flag's name reads as a description rather than an obligation, so agents treat it as informational.

      Renaming to `showcase` (or `user_demo`) reframes the field as an action the agent must perform before marking the target achieved: literally showing the result to the user. Completion of a showcase target should include a concrete demonstration step — run the binary with a player attached, publish the screenshot, open the dashboard, etc. — not just a "builds clean" report.

      Discovered while working on 🎯T10 (ge sample app): the tiltbuggy server connected to ged successfully but the user couldn't see anything until the player was actually launched, which required a follow-up prompt. The "observable" intent was there but the obligation wasn't codified.
    origin: discovered while working on 🎯T10 in squz/ge — tiltbuggy sample did not self-demo on completion
    discovered: 2026-04-16
  T15:
    name: A bullseye-native executor converges declared-strategy targets without human intervention
    status: identified
    value: 13.0
    cost: 13.0
    acceptance:
    - Targets in bullseye.yaml can declare a `strategy` block (command, trigger, timeout, retry/backoff policy)
    - A daemon reads strategy-bearing targets and runs them on a convergence loop, persisting per-target attempt state
    - 'Daemon implements the mechanical escalation ladder: per-attempt timeout, tick-level backoff, circuit-break on N consecutive failures, notification on threshold M'
    - Per-target status (last_attempt_at, last_success_at, consecutive_failures, cooldown_until) is queryable via CLI and MCP
    - At least one real-world target (yadm sync) is converged by the daemon, with the launchd-driven script retired
    - Documentation explains the strategy schema and the escalation ladder, with worked examples
    context: |-
      Targets are desired states. Many states are converged by mechanical action (push, sync, build, deploy) rather than human design work. Today these live as ad-hoc launchd jobs and shell scripts that fight the scheduler's quirks (no overlap protection on cron, no SSH timeout in launchd, no retry/backoff machinery, no observability into "is this state currently satisfied"). A bullseye-native executor would let targets declare their convergence strategy alongside their acceptance criteria, then run a stateless convergence loop that asks "is the target satisfied? if not, run the strategy" on each tick.

      Design decisions reached so far:

      **State-convergence framing simplifies retry semantics.** Each tick is independent — check target, run strategy if unsatisfied, note outcome. Stranded work, missed runs, and transient failures all converge on the next tick automatically. No separate "resume retry" state machine needed.

      **Non-agentic escalation ladder** for simple strategies:
      1. Per-attempt timeout (hard ceiling — kills hung-action class immediately)
      2. Tick-level backoff (consecutive failures stretch next-attempt interval: 30m → 2h → 6h)
      3. Circuit break (after N failures, skip attempts for cooldown; target shows as stalled, surfaces on frontier)
      4. Human notification (alerter at threshold M, push notification at threshold N)
      5. Escalation to agent (opt-in per target only; off by default for mechanical strategies like yadm push)

      Per-target state needed: consecutive_failures, last_attempt_at, last_success_at, cooldown_until. Trivial to persist alongside bullseye's existing state.

      **Why homegrown over windmill/dagu/kestra:**
      - Off-the-shelf tools think in jobs/workflows, not target-state convergence — bending them into shape is awkward.
      - Windmill's infrastructure weight (Postgres + Rust server + SvelteKit UI) is heavy for personal-laptop use.
      - bullseye+executor sharing one worldview (targets are first-class, strategies hang off them) gives a property the alternatives can't: one truth source, one CLI, one MCP surface.
      - Estimated 500-800 lines of Go/Rust for the daemon — smaller than the YAML config you'd write for ten tasks in windmill.

      **Likely shape:**
      - Daemon (Go or Rust, single binary) with launchd KeepAlive.
      - Strategy declared in target YAML: command, trigger (cron expr / fswatch path / on-wake / manual), timeout, retry policy, depends_on (already exists).
      - SQLite state (sqlift if Go).
      - MCP server for status/control (established pattern across mnemo/sysinfo-mcp/sawmill).
      - CLI for adhoc invocation and inspection.

      The executor will likely live in its own repo (working name TBD — crosshair? bullseye-agent?) but the strategic design lives in bullseye.yaml because the two are conceptually one system.
    origin: designed in conversation 2026-04-17 — emerged from yadm-auto-sync resilience problem (SSH push hung 9.5h, blocking subsequent launchd runs); generalised into "state convergence is the right abstraction for many recurring jobs"
    discovered: 2026-04-17
  T15.1:
    name: yadm-tracked dotfiles converge to clean+pushed state via the executor, replacing the launchd script
    status: identified
    value: 5.0
    cost: 3.0
    acceptance:
    - The launchd job com.marcelocantos.yadm-auto-sync is unloaded and the plist removed
    - The script ~/.local/bin/yadm-auto-sync is removed (or reduced to a thin invocation of the executor CLI)
    - yadm-tracked dotfiles converge automatically without human intervention, with no commits stranded for >1 hour after the working tree settles
    - A single SSH timeout no longer halts subsequent convergence attempts
    - Status of the yadm-sync target is queryable via the executor's MCP/CLI
    context: |-
      Proof point for 🎯T15. The current ~/.local/bin/yadm-auto-sync script + com.marcelocantos.yadm-auto-sync launchd job has a structural flaw: `yadm push` has no SSH timeout, so a half-dead TCP session can hang the script for hours, and launchd serialises by default so subsequent runs are blocked until the hung push gives up. Observed 2026-04-17: a push hung for 9.5 hours, blocking all morning syncs.

      Once the executor exists, this becomes a target with a tiny strategy declaration:
      - desired state: `yadm log @{u}..HEAD` empty AND `yadm status --short` clean
      - strategy: `yadm add -u && yadm commit -m "..." && yadm push` (or split into commit + push sub-strategies)
      - timeout: 60s per attempt (push with ConnectTimeout=15, ServerAlive)
      - backoff: 30m → 2h → 6h
      - circuit break: notify after 3 consecutive failures, push notification after 10

      Until the executor lands, the script needs a stopgap fix (add SSH timeout + push pending commits on heartbeat) so it stops failing visibly. That stopgap is intentionally NOT part of this target — it's pre-work to stop the bleeding while the proper solution is built.
    depends_on:
    - T15
    origin: forked-from T15 design conversation 2026-04-17
    discovered: 2026-04-17
  T16:
    name: Bullseye's repo-scope output is self-describing, so agents don't default to WSJF/SAFe framing at repo scope
    status: identified
    value: 0.0
    cost: 0.0
    observable: true
    acceptance:
    - '`bullseye_frontier`, `bullseye_summary`, and `bullseye_convergence` output include a one-line banner naming the repo-scope ordering function (min distance-to-observable, max fanout) and explicitly disavowing WSJF/value/cost at repo scope'
    - The per-entry annotations (`dist=N`, `fanout=N`, `observable`) are grouped under a brief legend so their meaning is visible without cross-referencing docs
    - '`~/.claude/convergence.md` notes the anti-pattern — do not frame repo-scope prioritisation in WSJF, story-points, or SAFe terms'
    context: |-
      Observed in a sibling-repo session (bullseye 0.17.0): an agent reasoning about frontier ordering reached for SAFe/WSJF framing out of training-data habit ("WSJF 2.67, same as T20"), even though bullseye 0.17.0's `bullseye_put` docstring already explains the phase boundary. The user challenged it; the agent self-corrected by quoting the docstring.

      The T11 docstring fix helps, but only activates when the agent reads `bullseye_put`'s schema. An agent reasoning about ranking from `bullseye_frontier` output sees `dist=1, fanout=2` with no in-band explanation of what those mean or what ordering they imply — and WSJF is much more available in training data than "distance-to-observable + unblocking fanout".

      Highest-leverage fix: put the correct framing in the context at the exact moment the agent is looking at the ranking. A one-line header on frontier/summary/convergence output is cheap and doesn't depend on the agent having read the tool docs first. The global convergence.md note is a backstop for general reasoning where the agent isn't staring at frontier output.

      Tradeoff: small amount of boilerplate on every frontier call, and it's a prompting-against-a-bad-habit fix rather than a root-cause fix. Still cheaper than the confusion it prevents. If the ordering function changes later, the banner changes with it.

      Not urgent — existing users are self-correcting on challenge. File for later work.
    tags:
    - docs
    - agent-ux
    origin: discovered in sibling-repo session 2026-04-18 — agent reached for WSJF framing at repo scope despite 🎯T11 docstring fix
    discovered: 2026-04-19
  T17:
    name: Bullseye tolerates concurrent writers — every mutation reads disk fresh, serialises with flock, and detects lost-update conflicts
    status: identified
    value: 0.0
    cost: 0.0
    observable: true
    acceptance:
    - 'Fresh read per tool call: every mutation (bullseye_put, bullseye_retire, and any other write-bearing tool) re-reads bullseye.yaml from disk before applying its changes. The cross-tool-call in-memory cache is removed, or invalidated via a cheap mtime+size check before every read.'
    - 'File lock around the read-modify-write cycle: mutations acquire an exclusive advisory lock (flock(2) on POSIX, LockFileEx on Windows) on bullseye.yaml for the entire RMW window. Concurrent bullseye processes serialise cleanly; readers that only list don''t need the lock.'
    - 'Bounded lock wait: a lock acquisition that can''t complete within a few seconds (configurable, default ~5s) fails with a structured error naming the contending PID where the platform allows it.'
    - 'Atomic write-back: write-back goes to a sibling tempfile in the same directory, followed by os.Rename (crash-safe). Document this explicitly in whichever module owns the YAML writer.'
    - 'Lost-update detection (CAS): in addition to the lock, bullseye records the mtime (or a content hash) at read time and compares at write time. If the file changed between read and write — lock dropped and re-acquired, read path didn''t hold the lock, or an editor-without-advisory-lock-honour edited in between — the mutation fails with a structured conflict error rather than clobbering.'
    - 'Listing reflects disk state: bullseye_list, bullseye_convergence, bullseye_frontier, and every other read-bearing tool re-read the file (or use the mtime fast-path) before returning. Stale cached results are not acceptable.'
    - 'Concurrency test: a test harness spawns two bullseye processes in parallel, each performing a distinct mutation (e.g. one retires T1, the other adds T99). After both return, the file must contain both mutations. The test loops ≥10 times to catch timing-sensitive races.'
    - 'Documentation: the README or ARCHITECTURE note explicitly states the file-level locking protocol so other tools that want to edit bullseye.yaml know what they''re sharing with.'
    context: |-
      Bullseye is configured as an stdio MCP server (per `~/.claude.json`), so every Claude Code session spawns its own bullseye process. Each process reads bullseye.yaml once (at startup or on first tool call) and mutates that in-memory model across subsequent `bullseye_put` / `bullseye_retire` / etc. calls, writing back to disk after each mutation.

      This produces three failure modes when more than one writer touches the same file:

      1. **Read-stale-and-clobber.** If session A adds T25 via `bullseye_put`, session B's bullseye still holds the pre-T25 model. B's next mutation (even on an unrelated target) serialises its whole in-memory model back to disk and silently deletes T25.
      2. **Listing lies.** Session B's `bullseye_list` returns the cached model, not disk state — so targets added by session A (or by a human editor) are invisible until session B's bullseye is restarted.
      3. **Concurrent write race.** Two bullseye processes saving in the same millisecond: whichever `os.Rename` lands second wins; the other's mutation is lost.

      Demonstrated in practice on 2026-04-20 in spyder's `bullseye.yaml`: session A added T25; session B (running concurrently) had just retired T23 and T24 and its `bullseye_list` reported 0 active targets despite T25 being on disk. T25 would have been clobbered if session B had performed any further mutation before being told to re-read.

      The root cause is that bullseye treats `bullseye.yaml` as if it owned it exclusively, but the project's own convention is that the YAML is edited by humans, scripts, AND bullseye itself. The in-memory cache model is simply wrong for that sharing pattern.

      **Rough scope:** 1–2 days. The mutations and lock wrapping are small; the concurrency test is where the time goes. The CAS layer is optional belt-and-braces if flock covers all the realistic cases, but worth including to catch the case where someone edits the YAML with an editor that doesn't honour advisory locks.
    tags:
    - correctness
    - concurrency
    - stdio
    - file-io
    - data-loss
    - mcp
    origin: demonstrated 2026-04-20 in spyder/bullseye.yaml — concurrent Claude Code sessions lost-update'd each other's target mutations
    discovered: 2026-04-21
