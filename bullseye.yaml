  T10:
    name: Target file is bullseye.yaml at repo root
    status: achieved
    value: 5.0
    cost: 3.0
    actual_cost: 3.0
    acceptance:
    - store::discover looks only at root-level bullseye.yaml
    - store::create_* creates bullseye.yaml at repo root
    - repo_root_from_targets_path reduces to path.parent()
    - render module deleted — no markdown output, no bullseye.md
    - bullseye_render tool removed from tool list
    - discover_markdown deleted
