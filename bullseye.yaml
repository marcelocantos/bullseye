    context: 'User declared the showcase construct ineffective in practice and asked for a clean removal. The flag was introduced in v0.13.0 (as `observable`) and renamed/strengthened in v0.19.0 (🎯T14) to oblige a `demonstration` string on retire. Empirically it didn''t change agent behaviour — the demonstration step it was meant to force still got skipped, while the field added schema surface, doc surface, tunnel-candidate code paths, and a parameter on `bullseye_put`/`bullseye_retire` that callers had to reason about. Removing it simplifies the model back to: verify-kind targets are checkpoints, everything else isn''t. Tunnel resolution becomes "add a verify target" full stop. This is a breaking change to schema (v3 → v4), to `bullseye_put` (loses `showcase`), and to `bullseye_retire` (loses `demonstration`); v3 yaml files load via permissive deserialisation and lose `showcase` / `demonstration` keys on next save (one-shot migration, equivalent to how `observable` → `showcase` migrated in v0.19.0).'
    origin: manual
    discovered: 2026-05-03
    achieved: 2026-05-11
  T24:
    name: bullseye refuses to mutate when running inside a submodule replica of the target repo
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - Before any mutating operation (put, retire, rework, set_aside, validate-with-rewrite, etc.) bullseye runs git rev-parse --show-superproject-working-tree. If the output is non-empty (i.e. cwd is inside a submodule), the mutation is refused with a clear error naming the superproject path and suggesting the canonical clone location (e.g. `~/work/<host>/<owner>/<repo>/`)
    - Read-only operations (list, frontier, get, summary, graph, etc.) are unaffected - they continue to work in submodule checkouts so an agent doing research from inside a parent project can still see targets
    - Mutating operations additionally refuse to auto-commit when HEAD is detached, even if not in a submodule. Detached HEAD means the user is at a tag or arbitrary SHA; auto-committing creates a dangling local branch that goes nowhere. The refusal explains that the user must check out a named branch first
    - 'Refusal messages are actionable: name the actual cwd, name the superproject (when applicable), name the suggested canonical path, and tell the agent how to retry (cd elsewhere or invoke with the right cwd parameter)'
    - 'Test coverage: a regression test creates a parent repo, adds the target repo as a submodule, runs bullseye_put with cwd inside the submodule, and asserts the call refuses with the expected error and that no commit lands in the submodule'
    origin: multimaze2 5/2026 - filed T41 in the multimaze2/ge submodule, which auto-committed to a local-only branch one commit past v0.9.0. The canonical clone showed nothing on grep. Auto-commit hides the modification from `git status` in the parent, so the bug is invisible until you go looking
    discovered: 2026-05-09
    achieved: 2026-05-11
  T25:
    name: 'Schema v5: target nodes are uniform — kind, verify edges, and rework apparatus are removed'
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - The `kind` field is removed from `Target`; legacy `kind:` values (`work`, `verify`) are silently dropped by serde on parse and stripped on the next save (one-shot migration, same shape as the v3→v4 showcase removal)
    - The `verifies` edge type and the `rework` edge with retry budget are removed; `depends_on` is the only structural edge type
    - Failed retirement reverts the target's status (to `converging` if previously attempted, otherwise `identified`) with audit-log entry; replaces the verify→rework retry-budget loop
    - '`is_checkpoint`, `checkpoint_distance`, `CHECKPOINT_REACH_LIMIT`, tunnel detection (`graph::tunnels`, `format_tunnel_warnings`, `suggest_checkpoint_candidates`), and the `bullseye_tunnels` MCP tool are all removed'
    - Repo-scope frontier ordering uses `depends_on` shape only (fanout, depth) — no checkpoint distance, no tunnel suppression
    - '`append_tunnel_warnings` is removed from the post-mutation handler path; mutations no longer emit checkpoint-related warnings'
    - 'Schema bumps to `schema_version: 5`; pre-v5 yaml files load unchanged with `kind:` / `verifies:` / `rework:` keys silently dropped'
    - '`bullseye.yaml` for the bullseye project itself is stripped of any remaining verify-kind nodes / verifies edges / rework edges on the migration commit'
    - README, agents-guide, mcp-triad, STABILITY, and convergence.md are updated to describe the uniform-node model; references to checkpoints/tunnels/verify-kind are removed or rewritten
    - Cargo tests pass; `make bullseye` is green
    context: 'Verify-kind targets have the same structural problem showcase had: they''re an arbitrary declaration that the graph and ordering should not have required. Acceptance criteria already carry the verification contract — whether the pass signal comes from CI, a human thumbs-up, a smoke test, or a design review is free-text on the acceptance, not a node-type property. Topologically a human ack and a CI green are identical: an assertion held, the node retires. The `kind` enum encodes shape into types when shape is a property of subgraphs, not nodes. Confusing the two is how showcase happened, and `kind: verify` is the same mistake with a different name. Collapsing the apparatus clears the substrate so graph-shape-as-design-vocabulary can carry the weight that the kind enum was trying to. The collapse also resolves the tool/agent split: bullseye-the-tool becomes minimal substrate (like Make), and the leverage moves to bullseye-the-practice — graph-shaping discipline carried by the agent.'
    origin: manual
    discovered: 2026-05-17
    achieved: 2026-05-17
  T26:
    name: Bullseye has a documented vocabulary of graph-shape patterns plus an agent discipline for using them
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - A `docs/shapes.md` catalogue exists, describing recurring graph patterns with name, ASCII diagram, when-to-use heuristic, and a worked example for each
    - 'The catalogue includes at minimum: diamond (design → build ∥ tests → validate), fan-out (one prerequisite enables many parallel children), chain (sequential dependency), choke-point (many parallel branches converge through a single node), spike-then-decide (research target gates fan-out of parallel implementation paths), contract-first (define API/contract, then parallel implementations against it), migration shape (prepare → cut-over ∥ keep-old-running → verify → remove-old)'
    - 'Global convergence.md (or equivalent guidance) names the agent discipline: when filing a new target, interrogate whether the acceptance criteria are hiding a subgraph; if they read as ''do X, then Y, then check Z'' inside one node''s text, propose the decomposition before doing the work'
    - Examples in the catalogue describe the post-v5 model (uniform nodes, no `kind` tagging) so the doc doesn't ossify the about-to-be-removed apparatus
    - '`bullseye_put` documentation or tool description references the vocabulary so the agent has the pattern names at hand when filing or patching'
    - At least one existing bullseye target is restructured into a diamond as a worked example of the discipline applied
    context: Graph shape is the primary artifact in bullseye; nodes are slots that the shape gives meaning to. A vocabulary of recurring patterns lets the agent recognise shapes mid-planning and propose them as decompositions ('this single node smells like a diamond'). Without named patterns and an explicit discipline, shaping stays ad-hoc and the agent under-uses the leverage. This is half of the agent-side investment that turns bullseye from a YAML format into a usable design substrate; the other half is subgraph-shaped tool affordances (separate target). Should be authored consistently with the schema v5 model (uniform nodes) so the doc doesn't need rewriting on landing.
    origin: manual
    discovered: 2026-05-17
  T27:
    name: Reshaping the graph is a single-call operation, not a sequence of node edits
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - A batch / subgraph-shaped tool affordance exists (either an extended `bullseye_put` or a new `bullseye_put_batch` / `bullseye_decompose`) that accepts a description of multiple nodes plus their internal edges in one call
    - 'Common reshape operations are single-call: splitting one node into a diamond (design → build ∥ tests → validate) is one call, not four `bullseye_put` calls plus manual dependency rewiring on whatever was downstream'
    - 'The tool supports rewiring: when decomposing node X into a subgraph, any existing dependents of X can be re-pointed to the subgraph''s tail node in the same call'
    - 'Tests cover end-to-end reshape operations: diamond decomposition, fan-out insertion above an existing node, chain extension, choke-point hoisting (multiple parents → one new prerequisite → many existing children)'
    - 'The tool surface either supports named patterns from `docs/shapes.md` (e.g. `shape: diamond, parts: [...]`) OR provides a generic enough batch-put that the named patterns can be built on top as a client-side convention'
