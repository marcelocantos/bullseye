      Refined on 2026-07-06: prefer self-contained enforcement in the generated `bullseye.yaml` preamble over sidecar state. The preamble should carry both the agent warning and a strong hash of the canonical target payload. That keeps the target store portable, avoids `.git` pollution, and makes direct edits visible anywhere the file travels.

