    context: |
      Design note: docs/mcp-triad.md. The three MCP servers (targets, sawmill, mnemo) each own a distinct concern (plan, code, history). Integrating them replaces the monolithic /cv skill with composable typed tool calls — faster, deterministic, and testable. The highest-value integration point is the /cv skill rewrite (step 3 in the design note).
    depends_on:
    - T1.1
    - T1.2
    - T1.3
    - T1.4
    - T1.5
    tags:
    - integration
    - architecture
    origin: manual
    discovered: 2026-04-07
    achieved: 2026-04-26
