    context: 'The current schema makes reshaping ceremonial: splitting one node into a diamond is four `bullseye_put` calls plus dependency rewiring on whatever was downstream. That ceremony discourages the move. If continuous graph evolution is the central rhythm (the waterfall → iterative reframe that justifies the whole state-graph framing), the friction of edits must be low enough that the agent reaches for them naturally. Batch / subgraph-shaped operations are what make that friction-free. Depends on schema v5 because designing the batch operation against the simpler post-v5 substrate (uniform nodes, single edge type) is dramatically cleaner than designing it against the current kind/verify/rework apparatus.'
