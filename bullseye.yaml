  T63:
    name: text_mentions_target_id never panics on multi-byte UTF-8 in consumer text
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: |-
      Fixed in 3e2c18c8d885d943ed2d34a9f6dc4a7f6ad8de98 (src/graph.rs text_mentions_target_id): advance by the UTF-8 length of the rejected hit's first char; break on an empty needle at end-of-string.

      Acceptance 1 (char-boundary advance): `abs` is always a find() hit, hence a char boundary, so `abs + first_char.len_utf8()` is always a boundary. Negative control — restoring `start = abs + 1` and running `cargo test --lib fake_edge_id_scan_survives_multibyte_utf8` fails with the exact incident message: "start byte index 6 is not a char boundary; it is inside '🎯' (bytes 5..9 of string)". A second negative control shows the naive `map_or(1, char::len_utf8)` variant still panics: "start byte index 4 is out of bounds for string of length 3" (empty-id path); that residual is why the committed form breaks instead.

      Acceptance 2 (unit regression): new test graph::t50_t53_tests::fake_edge_id_scan_survives_multibyte_utf8 covers needles t1 / 🎯t1 against 🎯t1.2, 🎯t10, multi-emoji text, a rejected hit ending the string, non-emoji multi-byte ("naïve — 🎯t1.2 → 🎯t1"), and the degenerate empty id. `cargo test` green: 136 lib + 153 integration, 0 failed. `cargo fmt --check` clean; `cargo clippy --all-targets` 0 errors and no warnings in graph.rs.

      Acceptance 3 (CLI on reproducer): ./target/debug/bullseye (relinked and mtime-verified against src) on ~/work/github.com/marcelocantos/orthograph exits 0 for query --view summary|context|validate|list|frontier|graph and for `open`. Stock /opt/homebrew/bin/bullseye 0.44.0 exits 101 on summary/context/validate with "char boundary; it is inside '🎯' (bytes 253..257 of string)".

      Acceptance 4 (MCP convergence): stdio JSON-RPC tools/call bullseye_convergence against orthograph returns a full Convergence report in 10.03s with the fixed binary; the stock 0.44.0 binary never answers (hung past a 120s probe budget) because the panic kills the request.

      Scope check: other byte-index arithmetic in graph.rs is boundary-safe — [..dot] at 378/1162 anchored on rfind('.'), as_bytes() reads at 707/708/715 are byte gets where continuation bytes are non-alphanumeric. portfolio.rs:851 and convergence.rs:124 slice on find()/len() results. No follow-up target needed.
