    discovered: 2026-05-17
    achieved: 2026-05-17
  T26:
    name: Bullseye has a documented vocabulary of graph-shape patterns plus an agent discipline for using them
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - A `docs/shapes.md` catalogue exists, describing recurring graph patterns with name, ASCII diagram, when-to-use heuristic, and a worked example for each
    - 'The catalogue includes at minimum: diamond (design → build ∥ tests → validate), fan-out (one prerequisite enables many parallel children), chain (sequential dependency), choke-point (many parallel branches converge through a single node), spike-then-decide (research target gates fan-out of parallel implementation paths), contract-first (define API/contract, then parallel implementations against it), migration shape (prepare → cut-over ∥ keep-old-running → verify → remove-old)'
    - 'Global convergence.md (or equivalent guidance) names the agent discipline: when filing a new target, interrogate whether the acceptance criteria are hiding a subgraph; if they read as ''do X, then Y, then check Z'' inside one node''s text, propose the decomposition before doing the work'
    - Examples in the catalogue describe the post-v5 model (uniform nodes, no `kind` tagging) so the doc doesn't ossify the about-to-be-removed apparatus
    - '`bullseye_put` documentation or tool description references the vocabulary so the agent has the pattern names at hand when filing or patching'
    - At least one existing bullseye target is restructured into a diamond as a worked example of the discipline applied
    context: Graph shape is the primary artifact in bullseye; nodes are slots that the shape gives meaning to. A vocabulary of recurring patterns lets the agent recognise shapes mid-planning and propose them as decompositions ('this single node smells like a diamond'). Without named patterns and an explicit discipline, shaping stays ad-hoc and the agent under-uses the leverage. This is half of the agent-side investment that turns bullseye from a YAML format into a usable design substrate; the other half is subgraph-shaped tool affordances (separate target). Should be authored consistently with the schema v5 model (uniform nodes) so the doc doesn't need rewriting on landing.
