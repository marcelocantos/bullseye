  T76:
    name: Every ledger mutation is expressible and discoverable through one `apply` verb whose help enumerates the complete field schema
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: '358 tests pass (cargo test, all targets); 5 commits aad3fc7..fe1b2e8. Each acceptance criterion probed against the built binary, not asserted: three input forms apply; 10/11 verbs delegate (9 via commit_sugar, split via ops::subdivide -> apply::apply), rehash scoped to the reconcile sibling from the outset; refusals quote the policy row and reject trivial attestations; apply --help and the MCP description both enumerate 19/19 fields, pinned by a test recovering the true field set from serde''s unknown-field error and verified to fail when a FIELD_HELP row is deleted; a one-target fragment leaves 117 targets at 117; stale base -> code=conflict; unrecognised flags rejected on apply and commit, unknown fragment fields rejected; CLI split wired and exercised via file and stdin. Residue: the drift oracle covers field presence, not blurb accuracy; and criterion 2''s earlier ''split cannot delegate'' claim was wrong and is corrected on the target.'
    acceptance:
    - '`bullseye_apply` / `bullseye apply` accepts a partial desired-state fragment for one or many targets, derives transitions from the diff against current state, and writes atomically. Three input forms (fragment on stdin, --id X --set field=value, structured op list) share one entry point.'
    - 'The named commit verbs are sugar over `apply`: ten of eleven delegate their mutation to the one engine (track, block, split, achieve, defer, reopen, assign, unassign, postpone, wake), and the existing test suite passes with no assertion weakened. `split` delegates child creation to the engine and keeps only its mode-dependent rewiring, which is composite workflow rather than desired state. `rehash` alone does not delegate: it re-stamps content_hash, an integrity op on the file rather than a ledger mutation, and this target''s context scoped it to the reconcile sibling from the outset. CORRECTION 2026-08-31: an earlier amendment claimed split could not delegate because the parent''s depends_on would reference child IDs that do not exist until allocation. That was wrong — subdivide resolves every child ID up front inside the same critical section, so no such window exists. The claim was made without reading the allocation code.'
    - A transition-policy table is the single source of evidence obligations (achieve needs attestation; defer/reopen need reason; postpone needs until or predicate; assign needs reason; immutable_achieved) expressed as data, unit-tested, and quoted in the rejection message naming the legal transitions. The obligations bind on every path, closing the put --status achieved and put --status identified back doors.
    - '`apply --help` and the MCP tool description enumerate every patchable field. No field is reachable only by reading source, and a test asserts the help text and the schema field-set agree so they cannot drift. The test recovers the true field list from serde''s own unknown-field error, and is verified to fail when a row is removed.'
    - A partial fragment never removes an unlisted target; removal requires an explicit remove list or a status change.
    - '`apply` accepts an optional base content hash and rejects with code=conflict on mismatch, making content_hash load-bearing on the write path rather than a passive tripwire.'
    - An unrecognised CLI flag or unknown fragment field is an error, not a silent no-op returning ok:true. Enforced on both `apply` and `commit`.
    - 'CLI split is wired: no ''CLI split not fully wired'' caveat remains in help, children are read from --children-file FILE or stdin, and both routes are tested end to end.'
    context: 'From a direct-edit audit (2026-08-31) of 313 hand-mutation tool calls on real bullseye.yaml files across ~30 repos. Root cause: patching name/acceptance/context/tags/status/value/cost/depends_on/origin already works on BOTH surfaces via commit --op track --id X, but commit --help advertises a create-only signature. Agents hand-edited those exact fields because the documented surface denied them. Naming a verb after one transition guarantees its other capabilities go unread, which is the argument for coalescing onto apply. Evidence: infractions per 1k file-edits fell 3.59 to 0.18 for Claude after the banner and hash landed (2026-07-29) but only 3.93 to 2.82 for other agents; 35 of 36 post-hash infractions are non-Claude, and 16 of 17 offending sessions made no MCP call while 11 used the CLI, so the CLI is the surface that matters for the offending population. Related: T74.1 (ledger mutations live only in the MCP adapter) is the natural companion. Out of scope here, filed separately: reconcile (rehash, three-way merge, laundering a hand edit); removing the two product strings that instruct hand-editing (handler.rs:1495, ops.rs:30); and making the hash check bite on load and validate instead of only in startup_context, since a successful mutation currently re-stamps the hash and silently blesses a forged payload.'
    tags:
    - api
