  T19:
    name: bullseye.yaml.lock lives outside the project directory, keyed by parent-directory inode rather than path
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - Lock target is no longer written into the project directory — every repo using bullseye stays free of `bullseye.yaml.lock` on disk
    - Lock path is keyed by the parent directory's `(dev_t, ino_t)` (e.g. `<temp-dir>/bullseye/locks/<dev>-<ino>.lock`), so atomic-rename YAML writes, repo directory renames, and symlinked access paths all coordinate against the same lock
    - Lock root directory is `std::env::temp_dir()` (resolves to per-user `$TMPDIR` on macOS, `/tmp` on Linux) — gives per-user isolation on macOS without code branching, and auto-clears on reboot so stale lock files never accumulate
    - Two concurrent bullseye processes accessing the same directory via different paths (e.g. one via the realpath, one via a symlink) acquire the same lock and serialise correctly — demonstrated in a test that exercises the path equivalence
    - The new lock dir is created lazily on first use; missing-dir startup does not panic
    - 'Existing repos with a stray `bullseye.yaml.lock` left behind by older builds: documented as safe to delete; no automated migration required since the file is zero-byte and ignored'
    - Documentation (CLAUDE.md / agents-guide / .gitignore template) updated to drop the `/bullseye.yaml.lock` ignore line and explain the new location
    context: |-
      Today bullseye writes `bullseye.yaml.lock` next to `bullseye.yaml` as the flock target. It's gitignored, but it visually clutters every repo that uses bullseye — it shows up in file browsers, IDE sidebars, and `ls`. The cross-cutting fix is to move the lock outside the project directory entirely.

      **Keying decision: parent-dir inode, not path hash.** Bullseye's save pattern is write-temp-then-rename, which changes the YAML file's inode on every save but leaves the parent directory's inode untouched. Keying on the parent dir's `(dev_t, ino_t)` is robust against atomic renames, repo-dir renames (which don't change the dir's inode), and symlink aliases (multiple paths to the same dir resolve to the same inode pair). Two distinct projects can never collide because they have distinct dir inodes; deleted-then-recreated dirs that happen to land on the same inode slot are harmless because that's a new project that legitimately wants a fresh lock.

      **Location decision: `std::env::temp_dir()`, not `~/.local/state`.** Locks are process-coordination primitives that have no meaning across reboots; using a temp dir gets reboot-clearing for free and avoids building cleanup machinery for accumulating zero-byte files. `std::env::temp_dir()` resolves to per-user `$TMPDIR` (`/var/folders/.../T/`) on macOS and `/tmp` on Linux — cross-platform with one expression and per-user isolation on macOS without conditional code. XDG state-dir is more "correct" by spec but forces pruning logic; the tradeoff isn't worth it for ephemeral coordination state.

      **Concrete shape:** lock at `std::env::temp_dir().join("bullseye/locks/<dev>-<ino>.lock")`. Created lazily on first use.

      Discovered 2026-04-25 while working on 🎯T18 — user flagged that the lock file pollutes every project directory, not just this one.</context>
      </invoke>
    origin: manual
    discovered: 2026-04-25
    achieved: 2026-04-26
