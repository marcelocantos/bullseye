    - Verify target failure includes sawmill structural failure report
    - Rework diagnosis includes mnemo prior-attempt history
    - Combined diagnosis is passed as targets_rework payload
    context: |-
      The rework agent gets maximum context: what failed (sawmill), what was tried before (mnemo), and retry budget status (targets). Sawmill T24 is achieved — `check_conventions` / `check_invariants` / `query` now emit structured failure payloads that bullseye can consume as the "what failed" half. The remaining external gap is on mnemo: no rework-aware query exists yet that returns prior attempts for a given target ID; filed as https://github.com/marcelocantos/mnemo/issues/57. See docs/mcp-triad.md section 4.

      Bullseye-side surface landed 2026-04-25: `bullseye_rework` accepts optional `sawmill_failure` and `mnemo_history` parameters (JSON-encoded strings — `serde_json::Value` would emit `type: unknown` which the Anthropic API rejects). Both are validated on the way in and persisted into the rework target's context as labelled fenced JSON blocks alongside the free-form `diagnosis` prose. Sawmill half is end-to-end usable now; the mnemo half is forward-compatible and waits on the upstream rework-aware query (mnemo#57).
