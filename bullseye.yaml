  T20:
    name: Mutating tools reject string inputs containing leaked Claude tool-call envelope markers (`&lt;invoke `, `&lt;/invoke&gt;`, `&lt;parameter `, `&lt;/parameter&gt;`) before persistence
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - 'A `check_no_envelope_leak(field, value)` validator (or equivalent) is called from every mutating handler that accepts caller-controlled string input: handle_put (name, context, acceptance items, tags, depends_on/blocks/verifies/cross_depends notes, origin), handle_retire (demonstration), handle_set_aside (reason), handle_rework (diagnosis, sawmill_failure, mnemo_history), handle_import (parsed-content strings)'
    - On detection, the handler returns an actionable error naming the offending field and the marker found, AND no file mutation occurs
    - Validation is applied at the write boundary only — `store::load` continues to load corrupted files unchanged so an operator can repair them
    - 'The four marker substrings are exact-matched: `<invoke ` (trailing space), `</invoke>`, `<parameter ` (trailing space), `</parameter>` — generic tags like `<context>` or `</tags>` are NOT included to avoid false positives on legitimate prose'
    - 'Tests cover: (a) each marker rejected per field, (b) legitimate content with angle brackets but not the markers passes, (c) the file is unchanged when validation fails, (d) the error message names the field and the marker'
    context: |-
      Discovered 2026-04-26 after a separate session in another repo (stock car racing) ended up with a malformed bullseye.yaml: closing tags `</context>`, `<tags>`, and `</invoke>` had leaked into a target's `context:` field as literal YAML content. Bullseye accepted the string verbatim and persisted it.

      Root cause is upstream of bullseye — the agent in that session emitted an XML-shaped tool call (training-data residue from the older Claude `<invoke name="..."><parameter name="...">...</parameter></invoke>` protocol), and the harness's wrapper-stripping was incomplete, leaving closing tags inside the JSON string parameter that hit `bullseye_put`. The same failure mode hit me earlier in this session when I formatted `acceptance` as `<acceptance>...</acceptance>` instead of a JSON array — bullseye correctly rejected it because acceptance is typed as a sequence, but the corruption lands silently when the leakage hits a free-text string field.

      Bullseye should not be a faithful storer of agent serialisation bugs. A small write-side validator catches the leakage at the point it would hit disk and returns a clear "your tool call was malformed" error instead of producing a YAML file with a stray `</invoke>` line that an unrelated future agent then has to debug.

      Concrete shape:

      ```rust
      const ENVELOPE_MARKERS: &[&str] = &["<invoke ", "</invoke>", "<parameter ", "</parameter>"];

      fn check_no_envelope_leak(field: &str, value: &str) -> Result<(), String> {
          for m in ENVELOPE_MARKERS {
              if value.contains(m) {
                  return Err(format!(
                      "{field} contains tool-call envelope marker `{m}` — looks like \
                       XML tool-call syntax leaked into the parameter value. This \
                       usually means the agent serialised the call as XML and the \
                       closing tags weren't stripped. Re-issue the call with \
                       well-formed JSON parameters."
                  ));
              }
          }
          Ok(())
      }
      ```

      Trade-off: a target legitimately quoting MCP envelope syntax in its acceptance prose would be rejected. Acceptable — they can rephrase or HTML-escape (`&lt;invoke ...&gt;`). False-positive cost is much lower than the cost of the silent corruption it prevents.

      Validation must NOT fire on `store::load` — corrupted files must remain loadable so an operator can repair them. Write-side only.
    tags:
    - validation
    - robustness
    - schema
    origin: forked-from cross-repo corruption observed 2026-04-26
    discovered: 2026-04-26
    achieved: 2026-04-26
  T21:
    name: Mutating tools warn about tunneled graphs without rejecting the write
    status: achieved
    value: 5.0
    cost: 3.0
    actual_cost: 3.0
    acceptance:
    - After any successful `bullseye_put` / `bullseye_retire` / `bullseye_set_aside`, the post-mutation graph is run through tunnel detection (existing `graph::tunnels` predicate)
    - 'If tunnels exist, the tool response includes a warning section listing each orphaned target with its distance-to-checkpoint result (`no checkpoint reachable in N hops`) and suggested checkpoint candidates: the dependents-graph root, any convergence node with in-degree ≥ 2 on the path upward, plus a hint that any node on the path can take `showcase: true`'
    - Mutations succeed regardless of warning state — the warning is informational, never a rejection. Existing tunnel-detection-as-block in `bullseye_convergence` and the read-side `bullseye_tunnels` tool stay unchanged as backstop signals
    - '`bullseye_validate` includes the same tunnel warnings in its output so the agent can audit graph health on demand'
    - 'Tests cover: (a) put/retire/set_aside that creates a tunnel emits the warning, (b) put/retire/set_aside that does not create a tunnel emits no warning, (c) the warning names the right targets and suggests at least one valid checkpoint candidate, (d) the mutation persisted regardless'
    context: |-
      Empirically every few sessions hits a state where the frontier is full of targets but `bullseye_convergence` refuses to recommend any of them because no checkpoint is reachable upward — every chain is a tunnel. The fix is almost always one-line: flip `showcase: true` on a parent / convergence node / root, which the agent can identify from context once it sees the graph shape.

      The painful version of this design would hard-reject mutations that leave tunnels, forcing a two-step ceremony (put, see error, re-put with the flag) for what is structurally a single edit. The soft version warns instead: the mutation persists, the response carries an actionable warning naming the orphaned targets and suggesting candidate showcase locations, and the agent flips the flag in a follow-up put. The graph can transiently sit in a tunneled state — that's no worse than today, where graphs sit in tunneled states *until convergence runs and discovers it three operations later, with lost context*. Surfacing the warning at the moment of mutation is the whole win.

      Heuristics for suggested checkpoints (informational, never auto-applied):
      - The dependents-graph root (no active target depends on it) — by construction the integrated user-visible state.
      - Convergence nodes (in-degree ≥ 2 on the path upward) — where multiple chains roll up.
      - Any node on the orphaned target's dependents path — the agent might want a mid-chain showcase for early visibility.

      Bullseye does not auto-flag anything. The agent decides; bullseye nudges.

      If empirically the warning gets ignored and graphs accumulate tunnels anyway, escalating to soft rejection (warning becomes an error unless `allow_tunnel: true` is passed) is a one-flip follow-up. Until that data exists, the lighter touch wins.

      Discovered 2026-04-27 in conversation while retiring 🎯T3.1, when the recurring "everything's a tunnel" pain prompted a redesign discussion that explored auto-promotion (rejected: dilutes signal) and hard rejection (rejected: ceremony for one-line fix) before landing on warn-and-persist.
    tags:
    - hygiene
    - schema
    - ux
    origin: manual
    discovered: 2026-04-27
    achieved: 2026-04-27
  T22:
    name: Bullseye self-commits a dirty bullseye.yaml so the project's invariants check never sees it
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - After any mutating tool call (put, retire, set_aside, rework, init, import), `bullseye.yaml` is committed automatically when the file lives inside a git repo.
    - If the most recent commit on HEAD is unpushed AND its set of changed files is exactly `{bullseye.yaml}`, the new state is folded into it via `git commit --amend --no-edit -- bullseye.yaml` (the existing message is preserved).
    - Otherwise, a new commit `Update bullseye.yaml` is created containing only the dirty `bullseye.yaml` (no other staged changes are folded in).
    - When `bullseye.yaml` is not inside a git repo (e.g. shadow-tree storage, tempdir tests), the auto-commit is a silent no-op.
    - Failures from git (broken repo state, hook rejection, missing binary) do not propagate as tool errors — they emit a single stderr line and leave the file dirty for the user to resolve manually.
    - '`bullseye_convergence` also runs the same auto-commit before evaluating invariants, so an externally-edited dirty `bullseye.yaml` is resolved at /cv time without a skill-side workaround.'
    - The `/cv` skill's special-case dirty-`bullseye.yaml` auto-commit block is removed in the same release that ships this behaviour — bullseye owns the policy now.
    context: 'Today the dirty-tree invariant in `make bullseye` blocks /cv whenever bullseye.yaml is uncommitted. The /cv skill carries a special-case workaround that detects "only bullseye.yaml is dirty" and auto-commits or amends. That workaround belongs inside bullseye itself: every bullseye mutation knows it just dirtied the file, so bullseye is the right layer to fold the change into git. Moving the policy server-side keeps the skill thin and makes the behaviour consistent across any caller (not just /cv). Decision rule (from the user): if the most recent commit is unpushed and contains only bullseye.yaml, amend it; otherwise, create a fresh commit with just bullseye.yaml. Implementation lives in a small `git_commit` module invoked from each mutation handler and from the start of `convergence::convergence` (defence in depth — covers manual yaml edits too). Best-effort: a git failure must never break a target mutation.'
