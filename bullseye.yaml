    name: An achieved target whose acceptance names identifiers the schema no longer has is visibly stale in the ledger, so no reader mistakes it for a live contract
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Inspecting an achieved target whose acceptance criteria name identifiers absent from the current code (removed struct fields, removed handlers) surfaces that staleness through bullseye's own output — not only by someone compiling a test against the text and hitting E0609/E0560.
    - 'T20 is the worked example: its acceptance names handle_retire(demonstration), handle_rework, and verifies, all removed by T23, and inspecting T20 after this target lands shows that.'
    - The recorded acceptance text of an achieved target is not silently rewritten — either immutability is preserved and staleness is carried alongside, or the owner rules amendment permissible and the ruling plus an amendment record (what changed, why, when) is written down.
    - Prose that merely mentions an identifier in passing does not produce a staleness mark, or the false-positive rate is measured and documented as accepted.
    context: |-
      Raised by bs-worktree-salvage, 2026-08-15. While classifying unmerged worktree commits it found a test, retire_rejects_envelope_marker_in_demonstration, that could not compile against master: it sets Target.showcase and builds RetireTool { demonstration: .. }, both removed by T23's v4 schema. The test looked valid precisely because T20's acceptance — an achieved, immutable target — still names those fields as the contract. The ledger asserted a contract the code had stopped honouring, and nothing in bullseye said so; a compiler did.

      Design-gated pending an owner ruling: achieved targets are immutable today, so the fix is either a staleness overlay computed at read time or a sanctioned amendment path. That choice is the owner's, not a worker's, so this is filed without a worker under T193's design-gated exception.

      SECOND WORKED EXAMPLE, from the overseer 2026-08-15 — and it discriminates between the two candidate designs. cl-ledger-heal repaired the illegal set_aside_reason on achieved 🎯T7.4/🎯T7.5 in the claudia ledger (claudia bc7bf7fd) and unsuppressed that repo's frontier view. It found, and deliberately did not touch, a second defect that predates the heal: both targets now read `achieved: 2026-08-15` where they should read `2026-07-11`. An earlier worker's reopen -> re-achieve cycle silently re-stamped the date, while its own attestation text sitting in the same file says it re-achieved on the ORIGINAL 2026-07-11 evidence. The record asserts an achievement date its own adjacent prose contradicts.

      Why this sharpens the ruling: a read-time STALENESS OVERLAY does not help here. The field is not stale prose whose referents have moved — it is a wrong fact that reads as authoritative, and no overlay computed from current code can know 2026-07-11 was the true date. An AMENDMENT PATH does help: restoring 2026-07-11 with a recorded reason is exactly an amendment. So the two examples pull in different directions — T20's dangling identifiers suit an overlay, T7.4/T7.5's rewritten date needs amendment — and the ruling should say which mechanism covers which class, or that one mechanism covers both. Also implicit: reopen -> achieve mutating a provenance field with a value nobody chose is itself the bug that produced this, and the ruling should say whether `achieved` is preserved across a re-achieve.

      claudia-po has been told to leave those dates alone pending the ruling; no date is being restored by hand in the meantime.
