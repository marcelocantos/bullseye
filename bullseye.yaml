  T73:
    name: Mutating the ledger does not write yaml-only git commits, and a dirty in-repo bullseye.yaml does not block standing invariants
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Landed in 0233c15. cargo test: mutation_does_not_create_yaml_only_git_commit, two_process_mutations_do_not_create_yaml_only_commits, convergence_dirty_yaml_passes_when_hook_ignores_ledger, nested yaml, Makefile/skeleton ignore. Real binary twice: commit_count stayed 1, HEAD still init/README.md. git_commit.rs deleted.'
    acceptance:
    - After any mutating tool call (track, achieve, defer, reopen, split, init, import, and shims), git history does not gain an `Update bullseye.yaml` commit or any other yaml-only commit produced by bullseye. A test drives a mutation in a git repo with a prior non-ledger commit and asserts the commit count is unchanged and HEAD still does not touch only bullseye.yaml.
    - 'bullseye_convergence with a dirty in-repo bullseye.yaml and an otherwise-green `make bullseye` reports standing invariants as passing — yaml dirt is not a blocking dirty-tree. A test demonstrates this. Residue: other dirty files still fail if the project''s hook says so.'
    - The Makefile skeleton emitted when the standing-invariants hook is missing ignores bullseye.yaml in its dirty-tree check, so a newly bootstrapped repo does not reintroduce T22's block.
    - STABILITY.md, src/git_commit.rs (removed or reduced to a no-op), and the T22 decision rule are restated so the written rule matches the code. The T72 amend-ownership path is gone with it, not left as dead code that can be re-enabled.
    - 'The T22 durability property is preserved by a different rail, not dropped: agents still cannot omit the ledger from origin. That rail is /commit (always stage a dirty in-repo bullseye.yaml) and /push (refuse when it is dirty). Bullseye itself does not commit the file.'
    context: |-
      T22 auto-commits a dirty in-repo bullseye.yaml after every mutation (and at the start of convergence) so agents cannot omit the ledger and so dirty-tree does not block /cv. That rail works and is now the dominant source of commit chatter: jevons 43/80 recent commits are `Update bullseye.yaml`, because auto-commit never folds into a work commit and T72 forbids amending another process's ledger SHA. The original failure mode was agents treating the yaml as irrelevant and leaving it out of commits and pushes. Replacement: stop yaml-only auto-commits; a dirty ledger must not fail standing invariants; /commit always stages the in-repo file and /push refuses if it is still dirty so origin cannot go stale. External/shadow ledgers are unchanged (no git). Nested in-repo paths (e.g. hms2/bullseye.yaml) count.

      Achieved 2026-08-19: Landed in 0233c15. cargo test: mutation_does_not_create_yaml_only_git_commit, two_process_mutations_do_not_create_yaml_only_commits, convergence_dirty_yaml_passes_when_hook_ignores_ledger, nested yaml, Makefile/skeleton ignore. Real binary twice: commit_count stayed 1, HEAD still init/README.md. git_commit.rs deleted.
