    achieved: 2026-08-31
  T77:
    name: Piping bullseye output into a program that exits early terminates cleanly instead of panicking
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - '`bullseye query ... | head -n` exits without a panic message on stdout/stderr, for every view, including outputs larger than the 64KB pipe buffer.'
    - The exit status of a truncated pipe is not a Rust panic abort; a shell pipeline using bullseye in a script does not print a backtrace note to the user.
    - A test covers the case by spawning the binary with a stdout consumer that closes early.
    context: |
      Observed once during the 🎯T76 session: `bullseye query --view target --id T76 --cwd . | head -6` printed "thread 'main' panicked at library/std/src/io/stdio.rs: failed printing to stdout: Broken pipe (os error 32)". NOT reproduced in 12 subsequent attempts of the same command.

      Mechanism is the standard Rust one: the runtime sets SIGPIPE to ignore, so a write to a closed pipe returns EPIPE and `println!` panics instead of the process dying quietly as a C program would. Usual fix is either restoring the default SIGPIPE disposition at startup or treating EPIPE on stdout as a clean exit.

      2026-08-31, after v0.49.0: two repro hypotheses tested and REFUTED, recorded so nobody retests them.
      (a) Small output racing the reader — 0 panics in 6 runs of `query --view target | head -2`.
      (b) Output larger than the 64 KiB pipe buffer, which is the usual trigger — 0 panics in 6 runs of `query --view list --filter all | head -1`. That view emits only ~38 KB, and nothing bullseye currently prints exceeds the buffer (convergence ~27 KB, other views smaller). So the ordinary SIGPIPE path may simply be unreachable from this binary's own output sizes, and the single observed panic came from something else — scheduling, a slow consumer, or a write that was not the main payload.

      Independent confirmation that the class is live in this toolchain, though in a different program: the /release skill's `discover.sh` misdetects every Apache-2.0 licence as MPL-2.0 because `echo "$head" | grep -qi "Apache License"` returns exit 141 under `set -o pipefail` — grep exits at the line-2 match, echo dies of SIGPIPE, and pipefail propagates the death of the writer as failure of the match. Same family, and it argues for fixing the disposition rather than waiting for a clean bullseye repro.

      Agent-facing impact is why this is worth more than cosmetics: agents pipe CLI output into head/grep constantly, and a panic there reads as a bullseye failure rather than a truncated read.
    tags:
    - cli
    - robustness
    - agent-dx
    origin: manual
    discovered: 2026-08-31
