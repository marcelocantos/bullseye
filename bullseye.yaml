  T30:
    name: bullseye.yaml carries a self-documenting header pointing to the project repo, regenerated on every write
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - store::save prepends a fixed header comment block to the serialized YAML on every write, so the header survives every mutation (it is emitted, never stored as data that serde would strip on parse)
    - The header is YAML comment lines so the file still parses; store::load ignores them and round-trips cleanly
    - The header explains the file's purpose (convergence targets, hand-editable, source of truth) and links to the bullseye GitHub repo so a developer can install bullseye
    - Starter files written by bullseye_init carry the header (it flows through save automatically)
    - This repo's own bullseye.yaml carries the header
    - 'Tests cover: saved output begins with the header and contains the repo URL; a load+save round-trip preserves the header and all target data; legacy/headerless files gain the header on next save without duplication'
    context: 'A developer encountering bullseye.yaml in a repo has no in-file signal about what it is or where it comes from. The file is serialized from a Rust struct via serde_yaml_ng, which strips comments on parse, so a hand-written comment would be lost on the next bullseye mutation. The robust fix is to make save() the single owner of a canonical header that is re-emitted on every write, present after any mutation, independent of prior file contents. Bare-minimum content: a pointer to the bullseye GitHub repo so the file is self-installing-documentation.'
