    - 'The rationale names the concrete failure: a concurrent writer (another session, a git-history-reserved slot, a portfolio sweep) between the caller''s read and Bullseye''s locked allocation makes any predicted ID diverge from the one actually written, while Bullseye''s own allocation stays correct under the mutation lock.'
    context: 'Filed from analysis of session b4947df3 (jevons target creation, 2026-07-06). T39 moved allocation AUTHORITY into Bullseye — the agent correctly omitted `id` and Bullseye allocated T36 atomically under with_locked_mutation. But the agent still grepped `^  T[0-9]+:` to compute "Max target is T35, so this will auto-assign T36" and narrated the predicted number instead of the returned one. That read-max-add-one prediction is a check-then-act race: it is computed from a stale read OUTSIDE the mutation lock, so any concurrent create between the read and the write shifts the real ID, leaving the agent''s narration wrong while the file stays correct — and the agent never notices because it trusted its prediction over the return value. This re-introduces the manual-numbering hazard T39 removed, one layer up in the narration path rather than the write path. Distinct from T41: T41 stops agents editing the file directly; this stops them simulating the allocator. The fix is guidance-only (tool description + agents-guide), no schema change.'
    tags:
