  T39.1:
    name: Dotted child IDs are umbrella edges, not display-only prefixes
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'No new edge type: child_of / explicit dotted create / split add call attach_dotted_child, which writes parent.depends_on += child and promotes Identified→Converging. validate_blocking errors if an active parent omits a live dotted child. refuse_active_family blocks handle_retire and put status=achieved while any direct dotted child is open; attach_dotted_child refuses a terminal parent. Docs: agents-guide put/commit child_of and split add; tools.rs commit/put/subdivide; STABILITY T39.1. Evidence: cargo test --test core_test 171 green, including put_child_of_auto_assigns_next_child_id, put_explicit_dotted_id_wires_umbrella, put_child_of_refuses_terminal_parent, put_explicit_dotted_id_refuses_terminal_parent, put_status_achieved_refuses_active_dotted_children, achieve_refuses_active_dotted_children, validate_flags_active_parent_missing_dotted_child, subdivide_add_mode_wires_dotted_parent_and_extends_dependents. cargo fmt --check and cargo clippy --all-targets -- -D warnings clean. In working tree, not released.'
    acceptance:
    - child_of (and explicit dotted-id create under a live parent) appends the child to the parent's depends_on and promotes Identified→Converging
    - split add does the same for children whose IDs are direct dotted children of the parent
    - validate_blocking errors when an active parent is missing any live direct dotted child in depends_on
    - achieve / status=achieved refuses while any direct dotted child is still active
    - child_of and dotted create refuse a terminal parent (revert/reopen first)
    - docs (agents-guide, put/commit child_of, split add) state that a dotted family cannot retire until its children do
    context: |-
      Jevons agents used child_of / dotted IDs as a family and then treated the parent as independently retireable (T540 on the frontier while T540.1/.2/.3 were open). Graph expand:children walks the ID prefix for display only; the only blocking edge is depends_on. child_of allocated an ID and left the parent untouched — same hole as split add. Product must wire the edge and refuse premature parent achieve so the convention cannot lie again.

