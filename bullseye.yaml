  T43:
    name: A target can be marked owned-by-another and excluded from an owner's frontier without being set aside
    status: achieved
    value: 3.0
    cost: 3.0
    actual_cost: 3.0
    acceptance:
    - A target carries an explicit ownership/exclusion disposition distinct from both status and set_aside; applying it removes the target from *this* owner's frontier and from bullseye_convergence's Next-action recommendation, while leaving its status (identified/converging) unchanged.
    - Unlike set_aside and achievement, the ownership exclusion does NOT unblock the target's dependents — a not-mine foundation still blocks the sub-targets that need its work, so excluding one target never leaks its dependents into the frontier.
    - bullseye_convergence renders ownership-excluded targets in a dedicated section (distinct from `## Set aside` and `## Blocked targets`), showing the owner and a reason.
    - A tool verb sets and clears the disposition; clearing restores the target to the normal frontier with its prior status intact.
    - agents-guide documents when to use ownership-exclusion vs set_aside, so agents stop overloading set_aside (and its parked / deferred / won't-fix connotation) for "someone else is driving this".
    context: |
      Filed 2026-07-06 from a mnemo /cv session. mnemo's 🎯T64.2 was being
      driven by a collaborator on an open PR, so it should not appear in
      Marcelo's frontier — but set_aside was the ONLY lever bullseye offers to
      remove a target from the frontier, and it is the wrong shape twice over:
      (1) it reads as parked / deferred / won't-fix, conflating a collaboration
      boundary with abandonment; and (2) it mechanically unblocks the target's
      dependents (treated exactly like achievement), which leaked
      T64.3/T64.5/T64.6 into the frontier and forced three manual
      "leak-containment" set_asides. The set_aside reason field can carry the
      nuance in prose, but a first-class owner/not-mine disposition would
      (a) preserve dependent-blocking (a not-mine foundation still blocks its
      sub-targets), (b) render distinctly rather than under "Set aside", and
