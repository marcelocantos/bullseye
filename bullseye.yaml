      VERIFIED LOCALLY, RE-RUN AGAINST HEAD AFTER 🎯T69 LANDED: two-arm discrimination holds. Arm A — the real published v0.44.0 goes RED (gate 56bcf31f, exit 101; earlier run 51d1462d), correctly detecting source-present/binary-absent. Arm B — an out-of-tree build of current HEAD goes GREEN (gate 2f029e53; earlier run 696a9b59), and the script's two marker strings still appear verbatim in that output (gate 92658e9e). 🎯T69's provenance stamp changed the version string the oracle records ("bullseye 0.44.0 (12a0e26ecfb1)" for the HEAD build vs "bullseye 0.44.0" for the published release) but moved neither marker, and the script never parses the version, so no change was needed. Also: shellcheck -x clean (gate 3fc32bc6); ci.yml YAML structure valid (gate t70-ci-yaml-valid); full suite green as the `check` job runs it (gate t70-cargo-test-as-ci); skip-refusal and missing-asset guards both fire (gates 7401439a, 365318fe). All ids above re-resolved independently by bullseye-po via `gate show`; the two unlabelled gates (t70-ci-yaml-valid, t70-cargo-test-as-ci) carry no id and are recorded as weaker evidence than the rest.

