      Ledger CONTENT was never at risk — store.rs holds flock + CAS, and I verified after the fact that T69's achieve, T70's residue and T71's second worked example all survive in HEAD. This is purely about SHA stability, and it matters because attestation is the fleet's verification currency: a cited SHA is how a reviewer re-checks a claim they did not watch happen. Once `git gc` prunes the orphans, reports citing them become unverifiable rather than merely stale, and the failure is silent — the SHA simply stops resolving.

