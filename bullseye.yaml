    - Mutating operations additionally refuse to auto-commit when HEAD is detached, even if not in a submodule. Detached HEAD means the user is at a tag or arbitrary SHA; auto-committing creates a dangling local branch that goes nowhere. The refusal explains that the user must check out a named branch first
