  T31:
    name: A Fly-hosted sqlpipe Master ingests GitHub App issue webhooks into per-repo SQLite tables
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 8.0
    acceptance:
    - The service exposes a webhook endpoint that verifies GitHub's X-Hub-Signature-256 HMAC and rejects unsigned/invalid deliveries.
    - Each issues-event delivery is upserted into a table partitioned per repository (one table/DB per repo), keyed by stable ids (repo id/node_id, issue node_id) — never owner/name.
    - 'Upsert is idempotent: redelivery of the same event produces no duplicate rows.'
    - The table is a sqlpipe Master (changeset tracking + convergence) ready to serve Replicas.
