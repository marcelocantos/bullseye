  T41:
    name: Agents mutate targets only through Bullseye tools unless the user explicitly permits direct file edits
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 5.0
    acceptance:
    - 'The generated `bullseye.yaml` preamble contains a strongly worded agent instruction: agents must not edit this file directly unless explicitly instructed by the user or repairing an unloadable file; use Bullseye MCP/CLI mutation tools instead.'
    - The generated preamble contains a strong content hash covering the canonical target payload, excluding the generated preamble/hash field itself.
    - Bullseye mutation paths update the preamble hash whenever they save the file, with no sidecar stamp and no `.git` pollution.
    - Validation or convergence checks detect hash mismatches and report a clear direct-edit warning that tells agents to use Bullseye MCP/CLI or obtain explicit user instruction.
    - An explicit emergency repair path can recompute the hash after a user-authorized direct edit, and the command requires a non-empty reason for the audit trail.
