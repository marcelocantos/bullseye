  T62:
    name: bullseye_convergence returns within a bounded time or fails loudly
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Commit a206e75 introduces src/bounded.rs (bounded_output + git_query) and routes every production subprocess through it: invariants hook, auto-commit''s git steps, gh calls in the issue mirror, id_alloc history scan, repo_guard probes. Auto-commit returns AutoCommitOutcome so a killed step is rendered, and convergence skips auto-commit entirely under skip_invariants (the back door that defeated the original retry). Oracles: GATE cargo-test exit=0 GREEN id=7980d881 (140 lib + 6 cli_parity + 161 core_test, 0 failed); GATE cargo-fmt exit=0 GREEN id=b8f625f6; GATE cargo-clippy-warnings exit=0 GREEN id=5a29890e. Regression tests covering the timeout path: bounded::tests::blocking_command_is_killed_at_the_bound, git_commit::tests::blocking_pre_commit_hook_times_out_instead_of_hanging, convergence_returns_despite_blocking_pre_commit_hook, convergence_skip_invariants_runs_no_project_hooks. Product path on the originally-hung repo: GATE bullseye-convergence exit=0 GREEN id=85b25141 dur=9.3s (orthograph) and id=3faa10db dur=0s with --skip-invariants — both well inside the 120s MCP budget. Residual: bounds are constants, not a single apportioned deadline; a repo where both the auto-commit hook and the invariants hook hang would still exceed 120s in the worst case (each step reports its own kill rather than the tool hanging).'
    acceptance:
    - bullseye_convergence over MCP returns a result (or a clear error) well inside the 120s harness budget on a small repo (~64 targets, make bullseye completing in ~2s)
    - With skip_invariants=true it never blocks on subprocess or build work at all
    - Any internal step that can block (make/mk invocation, git scan, subprocess I/O) has an explicit timeout that surfaces as a reported failure rather than an indefinite hang
    - A regression test covers the timeout path
    context: |-
      Observed 2026-08-08 in marcelocantos/orthograph (64 targets, no git tags). bullseye_convergence(cwd=orthograph) hung past the 120s MCP budget and was backgrounded; still running at ~11 min with no make/go child process visible in ps. Re-running with skip_invariants=true hung identically, so the invariants subprocess is not the (only) cause. `make bullseye` run by hand in the same repo completes green in 1.8s, and bullseye_frontier on the same cwd returns instantly — so the ledger read path and the build are both healthy; the hang is specific to the convergence tool. Effect: /cv is unusable in that repo.

      CORRECTION 2026-08-10, supersedes the original diagnosis. The hang is very likely the UTF-8 panic in graph.rs text_mentions_target_id (🎯T63) killing the MCP request without ever answering — not a timeout in the usual sense. With that fix applied, bullseye_convergence on orthograph returns in ~11s and `query --view summary` exits 0 where stock 0.44.0 panics. Hence the T63 dependency: diagnosing this against a tree where the panic fix is absent measures the panic, not the timeout path. Whoever picks this up should re-establish the symptom against a fixed tree BEFORE assuming an indefinite block still exists — the residual acceptance (explicit timeouts on blocking steps, regression test) may be guarding a different failure than the one originally reported, or may now be prophylactic.

