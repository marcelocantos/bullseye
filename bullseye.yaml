    set_aside_reason: 'Won''t fix as stated: clone-scoped T{scope}.{seq} IDs make hand-typing unbearable. Accept occasional cross-machine collisions; resolve hard when they matter. Future options include even/odd per-developer ranges. Auto-assign stays short sequential T{n} (T28 history-aware).'
    acceptance:
