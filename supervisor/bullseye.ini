; Bullseye HTTP MCP on :18743.
; Template: supervisor/install.sh writes supervisor.d/bullseye.ini with @REPO@ expanded.
; The program runs the Homebrew binary, so a tree build never squats the
; shared port — agents across every repo talk to this one process.
; install.sh fills the trailing placeholder on the environment line:
; BULLSEYE_T3_PLUGIN=1 supervisor/install.sh adds the opt-in T3 panel
; endpoint (/plugins/t3) to this process.

[program:bullseye]
command=@REPO@/supervisor/run-bullseye.sh
directory=@REPO@
environment=HOME="%(ENV_HOME)s",USER="%(ENV_USER)s",PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:%(ENV_HOME)s/.cargo/bin:%(ENV_HOME)s/.local/bin:%(ENV_HOME)s/.py/bin:%(ENV_HOME)s/go/bin:/usr/bin:/bin:/usr/sbin:/sbin",BULLSEYE_ADDR="127.0.0.1:18743"@EXTRA_ENV@
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=%(ENV_HOME)s/.local/var/log/bullseye.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
